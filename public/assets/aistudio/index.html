// Gemini দিয়ে লেখা তৈরি (ফ্রি টিয়ারে চলে); মূল মডেল ব্যস্ত থাকলে পরেরটায় যায়
const noThink = new Set();
async function claudeText(system, user, max_tokens = 800) {
  if (!GK) throw new Error('GEMINI_API_KEY সেট করা নেই');
  const body = {
    systemInstruction: { parts: [{ text: system }] },
    contents: [{ role: 'user', parts: [{ text: user }] }],
    generationConfig: { maxOutputTokens: max_tokens, temperature: 0.6, responseMimeType: 'application/json', thinkingConfig: { thinkingBudget: 0 } },
  };
  const models = [SMART, ...FALLBACKS].filter((m, i, a) => a.indexOf(m) === i);
  let lastErr = 'AI ত্রুটি';
  for (const m of models) {
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + m + ':generateContent';
    const go = (bd) => fetch(url, { method: 'POST', headers: { 'x-goog-api-key': GK, 'content-type': 'application/json' }, body: JSON.stringify(bd) });
    let bd = body;
    if (noThink.has(m)) { bd = JSON.parse(JSON.stringify(body)); delete bd.generationConfig.thinkingConfig; }
    let r = await go(bd);
    if (r.status === 400 && bd.generationConfig.thinkingConfig) {
      noThink.add(m);
      const b2 = JSON.parse(JSON.stringify(body));
      delete b2.generationConfig.thinkingConfig;
      b2.generationConfig.maxOutputTokens = Math.max(max_tokens * 2, 2000);
      r = await go(b2);
    }
    const j = await r.json().catch(() => ({}));
    if (r.ok) {
      const c = j.candidates && j.candidates[0];
      const t = ((c && c.content && c.content.parts) || []).map((p) => p.text || '').join('');
      if (t) return t;
      lastErr = 'AI উত্তর দেয়নি';
      continue;
    }
    lastErr = (j.error && j.error.message) || 'AI ত্রুটি ' + r.status;
    if (![404, 429, 500, 502, 503, 504].includes(r.status) && !/no longer available|high demand|overloaded|unavailable|not found/i.test(lastErr)) break;
  }
  throw new Error(lastErr);
}

// ---- সকালের প্রশ্ন (শ্রেণি + তারিখ অনুযায়ী একবার তৈরি হয়ে জমা থাকে) ----
async function dailyQ(cls, day, create) {
  const got = await sb(`/rest/v1/daily_wa?class_level=eq.${cls}&day=eq.${day}&select=q`);
  if (got && got[0]) return got[0].q;
  if (!create) return null;
  const subj = SUBJ[new Date(day + 'T00:00:00Z').getUTCDay()];
  const txt = await claudeText(
    'তুমি বাংলাদেশের NCTB পাঠ্যক্রমের প্রশ্নপ্রণেতা। শুধু একটি JSON অবজেক্ট দাও, আর কিছু নয়: {"q":"প্রশ্ন","o":["","","",""],"a":0-3,"s":"বিষয়"}। প্রশ্ন এক লাইনে, অপশনে ক/খ লেবেল নেই, ঠিক একটি উত্তর সঠিক, তথ্য নির্ভুল।',
    `শ্রেণি: ${CLS[cls] || cls}। বিষয়: ${subj}। একটি মাঝারি মানের MCQ বানাও। প্রশ্ন ও অপশন ছোট রাখো (মোট ২৫০ অক্ষরের মধ্যে)।`
  );
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  const q = JSON.parse(txt.slice(a, b + 1));
  if (!q.q || !Array.isArray(q.o) || q.o.length !== 4 || !(q.a >= 0 && q.a <= 3)) throw new Error('দৈনিক প্রশ্ন ফরম্যাট ভুল');
  q.s = q.s || subj;
  await sb('/rest/v1/daily_wa', { method: 'POST', headers: { Prefer: 'resolution=ignore-duplicates' }, body: JSON.stringify({ class_level: cls, day, q }) });
  return q;
}
const LET = ['ক', 'খ', 'গ', 'ঘ'];

// ---- অ্যাক্টিভিটি/স্ট্রিক ----
async function activity(uid, days) {
  const since = new Date(Date.now() - days * 864e5).toISOString();
  const rs = await sb(`/rest/v1/results?select=score,total,created_at,exams(title)&user_id=eq.${uid}&created_at=gte.${since}&order=created_at.desc&limit=500`);
  const dr = await sb(`/rest/v1/daily_runs?select=created_at&user_id=eq.${uid}&created_at=gte.${since}&limit=300`).catch(() => []);
  const set = new Set();
  (rs || []).forEach((r) => set.add(dkey(Date.parse(r.created_at))));
  (dr || []).forEach((r) => set.add(dkey(Date.parse(r.created_at))));
  let t = Date.now(), cur = 0;
  if (!set.has(dkey(t))) t -= 864e5;
  while (set.has(dkey(t))) { cur++; t -= 864e5; }
  return { rs: rs || [], streak: cur, doneToday: set.has(today()) };
}
async function userInfo(uid) {
  const r = await fetch(`${SB}/auth/v1/admin/users/${uid}`, { headers: { apikey: SK, Authorization: 'Bearer ' + SK } });
  const u = await r.json().catch(() => ({}));
  const m = u.user_metadata || {};
  return { name: m.full_name || (u.email || '').split('@')[0] || 'শিক্ষার্থী', cls: parseInt(m.class_level) || null };
}

async function jobDaily(dry) {
  const day = today();
  const f = encodeURIComponent(`(last_daily.is.null,last_daily.lt.${day})`);
  const prefs = (await sb(`/rest/v1/wa_prefs?daily_on=eq.true&wa_number=not.is.null&or=${f}&select=user_id,wa_number,class_level&limit=2000`)) || [];
  if (dry) return { dry: true, would_send: prefs.length };
  const infos = await pool(prefs, 6, async (p) => ({ p, i: await userInfo(p.user_id) }));
  const classes = [...new Set(infos.filter((x) => x && x.p).map((x) => x.p.class_level || x.i.cls || 8))];
  const qmap = {};
  for (const c of classes) { try { qmap[c] = await dailyQ(c, day, true); } catch (e) { qmap[c] = null; } }
  const yday = dkey(Date.now() - 864e5);
  const ymap = {};
  for (const c of classes) { ymap[c] = await dailyQ(c, yday, false).catch(() => null); }
  let sent = 0, failed = 0;
  await pool(infos.filter((x) => x && x.p), 5, async ({ p, i }) => {
    const cls = p.class_level || i.cls || 8;
    const q = qmap[cls];
    if (!q) { failed++; await wlog(p.user_id, 'daily', false, 'প্রশ্ন তৈরি হয়নি'); return; }
    try {
      const act = await activity(p.user_id, 60);
      const qt = `${q.q} ` + q.o.map((o, k) => `(${LET[k]}) ${o}`).join(' ');
      const yq = ymap[cls];
      const ya = yq ? `(${LET[yq.a]}) ${yq.o[yq.a]}` : 'আজই প্রথম প্রশ্ন';
      const sl = act.streak > 0
        ? `🔥 তোমার ${bn(act.streak)} দিনের স্ট্রিক চলছে — আজ একটি পরীক্ষা দিয়ে ধরে রাখো!`
        : '🔥 আজ একটি পরীক্ষা দিয়ে নতুন স্ট্রিক শুরু করো!';
      await sendTemplate(p.wa_number, TPL.daily, [i.name, q.s || 'সাধারণ', qt, ya, sl, SITE || 'আমাদের সাইট']);
      await sb(`/rest/v1/wa_prefs?user_id=eq.${p.user_id}`, { method: 'PATCH', body: JSON.stringify({ last_daily: day }) });
      await wlog(p.user_id, 'daily', true, 'ok');
      sent++;
    } catch (e) { failed++; await wlog(p.user_id, 'daily', false, e.message); }
  });
  return { sent, failed, total: prefs.length };
}

async function jobWeekly(dry) {
  const day = today();
  const lim = dkey(Date.now() - 5 * 864e5);
  const f = encodeURIComponent(`(last_weekly.is.null,last_weekly.lt.${lim})`);
  const prefs = (await sb(`/rest/v1/wa_prefs?weekly_on=eq.true&guardian_number=not.is.null&or=${f}&select=user_id,guardian_number&limit=2000`)) || [];
  if (dry) return { dry: true, would_send: prefs.length };
  let sent = 0, failed = 0;
  await pool(prefs, 5, async (p) => {
    try {
      const i = await userInfo(p.user_id);
      const act = await activity(p.user_id, 7);
      const pcs = act.rs.filter((r) => r.total > 0).map((r) => Math.round((r.score / r.total) * 100));
      const n = act.rs.length;
      const avg = pcs.length ? Math.round(pcs.reduce((a, b) => a + b, 0) / pcs.length) : 0;
      const best = pcs.length ? Math.max(...pcs) : 0;
      const cm = !n ? 'এই সপ্তাহে কোনো পরীক্ষা দেওয়া হয়নি — নিয়মিত অনুশীলনে উৎসাহ দিন।'
        : avg >= 80 ? 'চমৎকার ফল! এভাবেই চালিয়ে যেতে উৎসাহ দিন।'
        : avg >= 50 ? 'ভালো চলছে; দুর্বল অংশগুলো আবার দেখলে ফল আরও ভালো হবে।'
        : 'আরও অনুশীলন দরকার; প্রতিদিন অল্প সময় পড়ার অভ্যাস গড়তে সাহায্য করুন।';
      await sendTemplate(p.guardian_number, TPL.weekly, [i.name, bn(n), bn(avg) + '%', bn(best) + '%', bn(act.streak), cm]);
      await sb(`/rest/v1/wa_prefs?user_id=eq.${p.user_id}`, { method: 'PATCH', body: JSON.stringify({ last_weekly: day }) });
      await wlog(p.user_id, 'weekly', true, 'ok');
      sent++;
    } catch (e) { failed++; await wlog(p.user_id, 'weekly', false, e.message); }
  });
  return { sent, failed, total: prefs.length };
}

// ---- গেম জোনের নতুন প্রশ্ন (Gemini দিয়ে প্রতিদিন; আগের সব প্রশ্ন যেমন আছে তেমনই থাকে) ----
const GTHEMES = [
  'বাংলাদেশের ইতিহাস ও মুক্তিযুদ্ধ', 'বিজ্ঞান ও প্রকৃতি', 'গণিত ও যুক্তি', 'ভূগোল ও বিশ্বের দেশ-রাজধানী',
  'প্রাণী, পাখি ও গাছপালা', 'বাংলা ভাষা-সাহিত্য ও সংস্কৃতি', 'খেলাধুলা, প্রযুক্তি ও দৈনন্দিন জীবন',
];
const gnorm = (x) => String(x == null ? '' : x).replace(/\s+/g, ' ').trim().toLowerCase();
function gshuf(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function gjson(txt) {
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  const j = JSON.parse(txt.slice(a, b + 1));
  return Array.isArray(j.items) ? j.items : [];
}
// সংখ্যার ধাঁধার উত্তর আমরা নিজেরা যাচাই করি — এআই ভুল করলে সেটি বাদ যায়
function seqOk(t) {
  if (!Array.isArray(t) || t.length !== 6 || !t.every((x) => Number.isInteger(x) && Math.abs(x) <= 100000)) return false;
  if (new Set(t).size < 4) return false;
  const d = (a) => a.slice(1).map((x, i) => x - a[i]);
  const same = (a) => a.length > 1 && a.every((x) => x === a[0]);
  const d1 = d(t), d2 = d(d1), d3 = d(d2);
  if (same(d1) && d1[0] !== 0) return true;
  if (same(d2) && d2[0] !== 0) return true;
  if (same(d3) && d3[0] !== 0) return true;
  if (t[0] !== 0 && t.slice(1).every((x, i) => x * t[0] === t[i] * t[1]) && t[1] !== t[0]) return true;
  if (t.slice(2).every((x, i) => x === t[i] + t[i + 1])) return true;
  return false;
}
async function genSeq(day) {
  const txt = await claudeText(
    'তুমি স্কুলের শিক্ষার্থীদের জন্য সংখ্যার ধাঁধার প্রশ্নপ্রণেতা। শুধু JSON দাও: {"items":[{"t":[৬টি পূর্ণসংখ্যা]}]}। প্রতিটি t-তে ঠিক ৬টি সংখ্যা, একটি স্পষ্ট নিয়মে চলে (যোগ/বিয়োগ, গুণ, বর্গ, ঘন, ফিবোনাচ্চি-ধরন)। কোনো ব্যাখ্যা নয়।',
    `তারিখ ${day}। ৮টি ভিন্ন ধরনের ধাঁধা দাও, সহজ থেকে একটু কঠিন। সংখ্যা ছোট রাখো (সর্বোচ্চ ৫ অঙ্ক)।`, 900);
  return gjson(txt).filter((x) => seqOk(x.t)).map((x) => {
    const t = x.t, ans = t[5], last = t[5] - t[4];
    const cand = gshuf([ans + 1, ans - 1, ans + 2, ans - 2, ans + (last || 3), ans - (last || 3), ans + 10, ans * 2].filter((v, i, a) => v !== ans && a.indexOf(v) === i)).slice(0, 3);
    const opts = gshuf([ans, ...cand]);
    const f = (n) => bn(n).replace('-', '−');
    return { game: 'numseq', q: t.slice(0, 5).map(f).join(', ') + ', ?', opts: opts.map(f), ans: opts.indexOf(ans) };
  });
}

    .map((x) => ({ game: 'tf', q: flat(x.q, 160), opts: ['সত্য', 'মিথ্যা'], ans: x.a ? 0 : 1 }));

async function genPic(day, theme, avoid) {

    .map((x) => ({ a: flat(x.a, 20), b: flat(x.b, 20) }));

async function jobGames(dry) {
  const day = today();
  const theme = GTHEMES[new Date(day + 'T00:00:00Z').getUTCDay()];
  const oldP = (await sb('/rest/v1/game_puzzles?select=game,q&order=id.desc&limit=600')) || [];
  const oldM = (await sb('/rest/v1/game_pairs?select=a,b&order=id.desc&limit=600')) || [];
  const haveQ = new Set(oldP.map((x) => x.game + '|' + gnorm(x.q)));
  const haveA = new Set(oldM.flatMap((x) => [gnorm(x.a), gnorm(x.b)]));
  const avoid = (g) => oldP.filter((x) => x.game === g).slice(0, 30).map((x) => x.q).join(' | ') || 'কিছু নেই';
  const [seq, tf, pic, pr] = await Promise.all([
    genSeq(day).catch(() => []), genTF(day, theme, avoid('tf')).catch(() => []),
    genPic(day, theme, avoid('pic')).catch(() => []), genPairs(day, theme).catch(() => []),
  ]);
  const seen = new Set();
  const puz = [...seq, ...tf, ...pic].filter((x) => { const k = x.game + '|' + gnorm(x.q); if (haveQ.has(k) || seen.has(k)) return false; seen.add(k); return true; });
  const seenA = new Set();
  const prs = pr.filter((x) => { const a = gnorm(x.a), b = gnorm(x.b); if (haveA.has(a) || haveA.has(b) || seenA.has(a) || seenA.has(b)) return false; seenA.add(a); seenA.add(b); return true; });
  const cnt = (g) => puz.filter((x) => x.game === g).length;
  const out = { ok: true, day, theme, numseq: cnt('numseq'), tf: cnt('tf'), pic: cnt('pic'), pairs: prs.length };
  if (dry) return { ...out, dry: true };
  if (!puz.length && !prs.length) throw new Error('এআই থেকে কোনো বৈধ প্রশ্ন পাওয়া যায়নি — একটু পরে আবার চেষ্টা করুন');
  if (puz.length) await sb('/rest/v1/game_puzzles', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(puz) });
  if (prs.length) await sb('/rest/v1/game_pairs', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(prs) });
  return out;
}

module.exports = async (req, res) => {
  res.setHeader('Cache-Control', 'no-store');
  try {
    if (!SB || !SK) return res.status(500).json({ error: 'SUPABASE_URL / SUPABASE_SERVICE_KEY সেট করা নেই' });

    // Vercel Cron (GET) — Authorization: Bearer CRON_SECRET
    if (req.method === 'GET') {
      const cs = process.env.CRON_SECRET;
      if (!cs || (req.headers.authorization || '') !== 'Bearer ' + cs) return res.status(401).json({ error: 'unauthorized' });
      const job = (req.query && req.query.job) || '';
      if (job === 'games') return res.json(await jobGames(false));
      if (!WT || !PID) return res.status(500).json({ error: 'WA_TOKEN / WA_PHONE_ID সেট করা নেই' });
      if (job === 'daily') return res.json(await jobDaily(false));
      if (job === 'weekly') return res.json(await jobWeekly(false));
      return res.status(400).json({ error: 'job=daily|weekly|games দিন' });
    }
    if (req.method !== 'POST') return res.status(405).json({ error: 'method' });

    const u = await authUser(req);
    if (!u) return res.status(401).json({ error: 'লগইন করুন' });
    const b = typeof req.body === 'string' ? JSON.parse(req.body || '{}') : req.body || {};
    if ((!WT || !PID) && !(b.action === 'run' && b.job === 'games')) return res.status(500).json({ error: 'সার্ভারে WA_TOKEN / WA_PHONE_ID সেট করা নেই' });

    // স্টুডেন্ট: জমা দেওয়া মাত্র নিজের WhatsApp-এ উত্তরপত্র PDF
    if (b.action === 'result') {
      if (u.is_anonymous || !u.email) return res.status(403).json({ error: 'লগইন প্রয়োজন' });
      const pr = await sb(`/rest/v1/wa_prefs?user_id=eq.${u.id}&select=wa_number,result_on`);
      const p = pr && pr[0];
      if (!p || !p.result_on || !p.wa_number) return res.status(400).json({ error: 'WhatsApp অটো-সেন্ড চালু নেই' });
      const used = await sb(`/rest/v1/usage_log?user_id=eq.${u.id}&kind=eq.wa&day=eq.${today()}&select=id`);
      if ((used || []).length >= 15) return res.status(429).json({ error: 'আজকের সীমা শেষ' });
      const pdf = String(b.pdf || '');
      if (!pdf || pdf.length > 4_000_000) return res.status(400).json({ error: 'PDF ঠিক নেই বা বেশি বড়' });
      const i = await userInfo(u.id);
      try {
        const mid = await uploadPdf(pdf);
        await sendTemplate(
          p.wa_number, TPL.result,
          [i.name, flat(b.exam_title, 120), flat(b.score, 40)],
          { type: 'document', document: { id: mid, filename: 'answer-sheet.pdf' } }
        );
        await sb('/rest/v1/usage_log', { method: 'POST', body: JSON.stringify({ user_id: u.id, kind: 'wa' }) });
        await wlog(u.id, 'result', true, 'ok');
        return res.json({ ok: true });
      } catch (e) { await wlog(u.id, 'result', false, e.message); throw e; }
    }

    // অ্যাডমিন টুলস
    if (!(await isAdmin(u.id))) return res.status(403).json({ error: 'শুধু অ্যাডমিন' });
    if (b.action === 'run') {
      if (b.job === 'daily') return res.json(await jobDaily(!!b.dry));
      if (b.job === 'weekly') return res.json(await jobWeekly(!!b.dry));
      if (b.job === 'games') return res.json(await jobGames(!!b.dry));
      return res.status(400).json({ error: 'job ভুল' });
    }
    if (b.action === 'test') {
      let to = String(b.to || '').replace(/\D/g, '');
      if (/^01\d{9}$/.test(to)) to = '88' + to;
      if (!/^8801\d{9}$/.test(to)) return res.status(400).json({ error: 'সঠিক নম্বর দিন' });
      await sendTemplate(to, 'hello_world', [], null, 'en_US'); // Meta-র তৈরি করা ডিফল্ট টেমপ্লেট
      return res.json({ ok: true });
    }
    return res.status(400).json({ error: 'অজানা action' });
  } catch (e) {
    return res.status(500).json({ error: String((e && e.message) || e) });
  }
};

<script type="text/plain" id="v4-sql">
-- ===== স্পিন (বাড়তি স্পিন কেনা) + ব্যাজ — একবার Run করুন (বারবার Run করলেও সমস্যা নেই) =====

-- ১) বাড়তি স্পিনের জন্য কলাম, আর "প্রতিদিন একটি" নিয়মটা শুধু ফ্রি স্পিনের জন্য রাখা
alter table public.spin_log add column if not exists paid boolean not null default false;
alter table public.spin_log drop constraint if exists spin_log_user_id_spin_date_key;
drop index if exists public.spin_log_user_id_spin_date_key;
create unique index if not exists spin_log_free_uq on public.spin_log(user_id,spin_date) where not paid;

-- ২) বাড়তি স্পিনের দাম (কয়েন)। বদলাতে চাইলে এই সংখ্যা বদলে আবার Run করবেন না,
--    বরং: update public.ai_config set val=৭৫ where key='spin_cost';
insert into public.ai_config(key,val) values ('spin_cost',50) on conflict(key) do nothing;

-- ৩) আজকের ফ্রি স্পিনের অবস্থা (বাড়তি স্পিনের সারি গুনবে না)
create or replace function public.spin_status() returns jsonb
language sql stable security definer set search_path to 'public' as $function$
  select (select jsonb_build_object('id',prize_id,'emoji',emoji,'label',label,'kind',kind,'value',value)
          from public.spin_log
          where user_id=auth.uid() and not paid
            and spin_date=(now() at time zone 'Asia/Dhaka')::date
          order by id limit 1) $function$;

-- ৪) ফ্রি স্পিন (আগের মতোই; এখন কয়েন পুরস্কার ওয়ালেটেও যোগ হয়)
create or replace function public.spin_wheel() returns jsonb
language plpgsql security definer set search_path to 'public' as $function$
declare d date := (now() at time zone 'Asia/Dhaka')::date;
p public.spin_prizes; tot int; x int; acc int := 0;
begin
  if auth.uid() is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'স্পিন করতে অ্যাকাউন্টে লগইন করুন'; end if;
  if exists(select 1 from public.spin_log where user_id=auth.uid() and spin_date=d and not paid) then
    raise exception 'আজকের ফ্রি স্পিন হয়ে গেছে, কাল আবার আসুন';
  end if;
  select coalesce(sum(weight),0) into tot from public.spin_prizes where active;
  if tot<=0 then raise exception 'স্পিন এখনও চালু হয়নি'; end if;
  x := floor(random()*tot)::int;
  for p in select * from public.spin_prizes where active and weight>0 order by id loop
    acc := acc+p.weight;
    if x<acc then exit; end if;
  end loop;
  begin
    insert into public.spin_log(user_id,prize_id,emoji,label,kind,value,spin_date)
    values(auth.uid(),p.id,p.emoji,p.label,p.kind,p.value,d);
  exception when unique_violation then
    raise exception 'আজকের ফ্রি স্পিন হয়ে গেছে, কাল আবার আসুন';
  end;
  if p.kind='premium' and p.value>0 then perform public.grant_premium_days(auth.uid(),p.value); end if;
  if p.kind='coin' and p.value>0 then perform public._coin_add(auth.uid(),p.value,'স্পিন পুরস্কার',null); end if;
  return jsonb_build_object('id',p.id,'emoji',p.emoji,'label',p.label,'kind',p.kind,'value',p.value);
end $function$;

-- ৫) কয়েন দিয়ে বাড়তি স্পিন (আগে আজকের ফ্রি স্পিন শেষ হতে হবে)
create or replace function public.spin_buy() returns jsonb
language plpgsql security definer set search_path to 'public' as $function$
declare d date := (now() at time zone 'Asia/Dhaka')::date; uid uuid := auth.uid();
p public.spin_prizes; tot int; x int; acc int := 0; cost int; w public.coin_wallet%rowtype;
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'স্পিন করতে অ্যাকাউন্টে লগইন করুন'; end if;
  if not exists(select 1 from public.spin_log where user_id=uid and spin_date=d and not paid) then
    raise exception 'আগে আজকের ফ্রি স্পিনটি ব্যবহার করুন';
  end if;
  cost := coalesce(public._cfg('spin_cost'),50);
  insert into public.coin_wallet(user_id) values(uid) on conflict do nothing;
  select * into w from public.coin_wallet where user_id=uid for update;
  if w.balance<cost then raise exception 'পর্যাপ্ত কয়েন নেই (লাগবে %, আছে %)',cost,w.balance; end if;
  select coalesce(sum(weight),0) into tot from public.spin_prizes where active;
  if tot<=0 then raise exception 'স্পিন এখনও চালু হয়নি'; end if;
  x := floor(random()*tot)::int;
  for p in select * from public.spin_prizes where active and weight>0 order by id loop
    acc := acc+p.weight;
    if x<acc then exit; end if;
  end loop;
  update public.coin_wallet set balance=balance-cost, updated_at=now() where user_id=uid;
  insert into public.coin_log(user_id,delta,reason) values(uid,-cost,'বাড়তি স্পিন');
  insert into public.spin_log(user_id,prize_id,emoji,label,kind,value,spin_date,paid)
  values(uid,p.id,p.emoji,p.label,p.kind,p.value,d,true);
  if p.kind='premium' and p.value>0 then perform public.grant_premium_days(uid,p.value); end if;
  if p.kind='coin' and p.value>0 then perform public._coin_add(uid,p.value,'স্পিন পুরস্কার',null); end if;
  return jsonb_build_object('id',p.id,'emoji',p.emoji,'label',p.label,'kind',p.kind,'value',p.value,'cost',cost);
end $function$;

revoke all on function public.spin_buy() from public,anon;
grant execute on function public.spin_buy() to authenticated;
</script>

-- ১) স্পিন পুরস্কারের ধরন (xp, coin, premium, text, none) যেন কোনো পুরোনো নিয়মে না আটকায়

exception when others then null; end $$;

-- ২) বকেয়া কয়েন মেটানোর ফাংশন (আগের জেতা কয়েন যেগুলো ওয়ালেটে ঢোকেনি)
create or replace function public._spin_fix_user(p_user uuid) returns int
language plpgsql security definer set search_path to 'public' as $f$
declare r record; have int; i int; tot int := 0;
begin
  for r in select spin_date,value,count(*)::int n from public.spin_log
           where user_id=p_user and kind='coin' and value>0 group by spin_date,value loop
    select count(*) into have from public.coin_log
      where user_id=p_user and reason like 'স্পিন পুরস্কার%' and delta=r.value
        and (created_at at time zone 'Asia/Dhaka')::date=r.spin_date;
    for i in 1..greatest(0,r.n-have) loop
      if public._coin_add(p_user,r.value,'স্পিন পুরস্কার (বকেয়া)','spinfix:'||r.spin_date||':'||r.value||':'||i) then
        tot := tot+r.value;
      end if;
    end loop;
  end loop;
  return tot;
end $f$;
revoke all on function public._spin_fix_user(uuid) from public,anon,authenticated;

create or replace function public.spin_claim_missing() returns int
language plpgsql security definer set search_path to 'public' as $f$
begin
  if auth.uid() is null then return 0; end if;
  return public._spin_fix_user(auth.uid());
end $f$;
revoke all on function public.spin_claim_missing() from public,anon;
grant execute on function public.spin_claim_missing() to authenticated;

-- ৩) ফ্রি স্পিন: কয়েন জিতলে সঙ্গে সঙ্গে ওয়ালেটে যোগ
create or replace function public.spin_wheel() returns jsonb
language plpgsql security definer set search_path to 'public' as $function$
declare d date := (now() at time zone 'Asia/Dhaka')::date; uid uuid := auth.uid();
p public.spin_prizes; tot int; x int; acc int := 0; lid bigint;
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'স্পিন করতে অ্যাকাউন্টে লগইন করুন'; end if;
  if exists(select 1 from public.spin_log where user_id=uid and spin_date=d and not paid) then
    raise exception 'আজকের ফ্রি স্পিন হয়ে গেছে, কাল আবার আসুন';
  end if;
  select coalesce(sum(weight),0) into tot from public.spin_prizes where active;
  if tot<=0 then raise exception 'স্পিন এখনও চালু হয়নি'; end if;
  x := floor(random()*tot)::int;
  for p in select * from public.spin_prizes where active and weight>0 order by id loop
    acc := acc+p.weight;
    if x<acc then exit; end if;
  end loop;
  begin
    insert into public.spin_log(user_id,prize_id,emoji,label,kind,value,spin_date)
    values(uid,p.id,p.emoji,p.label,p.kind,p.value,d) returning id into lid;
  exception when unique_violation then
    raise exception 'আজকের ফ্রি স্পিন হয়ে গেছে, কাল আবার আসুন';
  end;
  if p.kind='premium' and p.value>0 then perform public.grant_premium_days(uid,p.value); end if;
  if p.kind='coin' and p.value>0 then perform public._coin_add(uid,p.value,'স্পিন পুরস্কার','spin:'||lid); end if;
  return jsonb_build_object('id',p.id,'emoji',p.emoji,'label',p.label,'kind',p.kind,'value',p.value);
end $function$;

-- ৪) বাড়তি (কয়েন দিয়ে কেনা) স্পিন: একইভাবে
create or replace function public.spin_buy() returns jsonb
language plpgsql security definer set search_path to 'public' as $function$
declare d date := (now() at time zone 'Asia/Dhaka')::date; uid uuid := auth.uid();
p public.spin_prizes; tot int; x int; acc int := 0; cost int; w public.coin_wallet%rowtype; lid bigint;
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'স্পিন করতে অ্যাকাউন্টে লগইন করুন'; end if;
  if not exists(select 1 from public.spin_log where user_id=uid and spin_date=d and not paid) then
    raise exception 'আগে আজকের ফ্রি স্পিনটি ব্যবহার করুন';
  end if;
  cost := coalesce(public._cfg('spin_cost'),50);
  insert into public.coin_wallet(user_id) values(uid) on conflict do nothing;
  select * into w from public.coin_wallet where user_id=uid for update;
  if w.balance<cost then raise exception 'পর্যাপ্ত কয়েন নেই (লাগবে %, আছে %)',cost,w.balance; end if;
  select coalesce(sum(weight),0) into tot from public.spin_prizes where active;
  if tot<=0 then raise exception 'স্পিন এখনও চালু হয়নি'; end if;
  x := floor(random()*tot)::int;
  for p in select * from public.spin_prizes where active and weight>0 order by id loop
    acc := acc+p.weight;
    if x<acc then exit; end if;
  end loop;
  update public.coin_wallet set balance=balance-cost, updated_at=now() where user_id=uid;
  insert into public.coin_log(user_id,delta,reason) values(uid,-cost,'বাড়তি স্পিন');
  insert into public.spin_log(user_id,prize_id,emoji,label,kind,value,spin_date,paid)
  values(uid,p.id,p.emoji,p.label,p.kind,p.value,d,true) returning id into lid;
  if p.kind='premium' and p.value>0 then perform public.grant_premium_days(uid,p.value); end if;
  if p.kind='coin' and p.value>0 then perform public._coin_add(uid,p.value,'স্পিন পুরস্কার','spin:'||lid); end if;
  return jsonb_build_object('id',p.id,'emoji',p.emoji,'label',p.label,'kind',p.kind,'value',p.value,'cost',cost);
end $function$;
revoke all on function public.spin_buy() from public,anon;
grant execute on function public.spin_buy() to authenticated;

-- ৫) এখন পর্যন্ত সবার বকেয়া স্পিন-কয়েন একবারে ওয়ালেটে ঢুকিয়ে দেওয়া
select public._spin_fix_user(u) from (select distinct user_id u from public.spin_log where kind='coin') s;

insert into public.ai_config(key,val) values ('friend_win_coin',10) on conflict(key) do nothing;

alter table public.friend_profiles enable row level security;

create table if not exists public.friend_challenges(

-- (কোনো policy নেই: সব কাজ নিচের নিরাপদ ফাংশনের মাধ্যমে হয়; ইমেইল কখনও অন্যকে দেখানো হয় না)

create or replace function public.friend_sync(p_name text,p_avatar text,p_badges jsonb,p_xp int,p_level int) returns void
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); ms int := 0; rb jsonb := '[]'::jsonb; sb jsonb := '[]'::jsonb; nm text;
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then return; end if;
  nm := left(btrim(coalesce(p_name,'')),40); if nm='' then nm := 'শিক্ষার্থী'; end if;
  begin
    select coalesce(max(c),0) into ms from (
      select count(*) c from (
        select dt, dt-(row_number() over(order by dt))::int g from (
          select (created_at at time zone 'Asia/Dhaka')::date dt from public.results where user_id=uid
          union
          select (created_at at time zone 'Asia/Dhaka')::date from public.daily_runs where user_id=uid) d) x
      group by g) y;
  exception when others then
    begin
      select coalesce(max(c),0) into ms from (
        select count(*) c from (
          select dt, dt-(row_number() over(order by dt))::int g from (
            select distinct (created_at at time zone 'Asia/Dhaka')::date dt from public.results where user_id=uid) d) x
        group by g) y;
    exception when others then ms := 0; end;
  end;
  begin
    select coalesce(jsonb_agg(jsonb_build_object('e',left(coalesce(r.emoji,'🏅'),8),'t',left(coalesce(r.title,''),40)) order by r.id),'[]'::jsonb)
      into rb from public.user_badges ub join public.rare_badges r on r.id=ub.badge_id where ub.user_id=uid;
  exception when others then rb := '[]'::jsonb; end;
  if jsonb_typeof(p_badges)='array' then
    select coalesce(jsonb_agg(jsonb_build_object('e',left(coalesce(b->>'e','🏅'),8),'t',left(coalesce(b->>'t',''),40))),'[]'::jsonb)
      into sb from (select b from jsonb_array_elements(p_badges) b limit 16) q;
  end if;
  insert into public.friend_profiles(user_id,name,avatar,xp,level,max_streak,std_badges,rare_badges,updated_at)
  values(uid,nm,left(coalesce(p_avatar,''),8),greatest(0,least(coalesce(p_xp,0),10000000)),greatest(1,least(coalesce(p_level,1),1000)),ms,sb,rb,now())
  on conflict(user_id) do update set name=excluded.name,avatar=excluded.avatar,xp=excluded.xp,level=excluded.level,
    max_streak=excluded.max_streak,std_badges=excluded.std_badges,rare_badges=excluded.rare_badges,updated_at=now();
end $f$;

create or replace function public.friend_set_visible(p_visible boolean) returns void
language plpgsql security definer set search_path to 'public' as $f$
begin
  if auth.uid() is null then return; end if;
  update public.friend_profiles set visible=coalesce(p_visible,true) where user_id=auth.uid();
end $f$;

create or replace function public.friend_list(p_q text default null)
returns table(f_id uuid,f_name text,f_avatar text,f_xp int,f_level int,f_streak int,f_std jsonb,f_rare jsonb,f_wins int,f_losses int,f_me boolean,f_vis boolean)
language plpgsql security definer set search_path to 'public' as $f$
begin
  if auth.uid() is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ফ্রেন্ড জোনে ঢুকতে ইমেইল দিয়ে লগইন করুন'; end if;
  return query
  select p.user_id,p.name,p.avatar,p.xp,p.level,p.max_streak,p.std_badges,p.rare_badges,
    (select count(*)::int from public.friend_challenges c where c.status='done' and c.winner=p.user_id),
    (select count(*)::int from public.friend_challenges c where c.status='done' and c.winner is not null and c.winner<>p.user_id and (c.from_user=p.user_id or c.to_user=p.user_id)),
    (p.user_id=auth.uid()),p.visible
  from public.friend_profiles p
  where (p.visible or p.user_id=auth.uid())
    and (p_q is null or btrim(p_q)='' or p.name ilike '%'||btrim(p_q)||'%')
  order by (p.user_id=auth.uid()) desc, p.xp desc, p.name
  limit 300;
end $f$;

create or replace function public._friend_finish(p_id bigint,p_score numeric,p_max numeric) returns void
language plpgsql security definer set search_path to 'public' as $f$
declare c public.friend_challenges; a numeric; b numeric; w uuid; coin int; cnt int;
begin
  select * into c from public.friend_challenges where id=p_id and status='pending' for update;
  if not found then return; end if;
  a := coalesce(c.from_score/nullif(c.from_max,0),0);
  b := coalesce(p_score/nullif(p_max,0),0);
  w := case when a>b then c.from_user when b>a then c.to_user else null end;
  update public.friend_challenges set to_score=p_score,to_max=p_max,status='done',winner=w,done_at=now() where id=p_id;
  if w is not null then
    coin := coalesce(public._cfg('friend_win_coin'),10);
    select count(*) into cnt from public.coin_log
      where user_id=w and reason='ফ্রেন্ড চ্যালেঞ্জ জয়'
        and created_at>=((date_trunc('day',now() at time zone 'Asia/Dhaka')) at time zone 'Asia/Dhaka');
    if coin>0 and cnt<3 then perform public._coin_add(w,coin,'ফ্রেন্ড চ্যালেঞ্জ জয়','fc:'||p_id); end if;
  end if;
end $f$;
revoke all on function public._friend_finish(bigint,numeric,numeric) from public,anon,authenticated;

create or replace function public.friend_challenge_exam(p_to uuid,p_exam bigint) returns bigint
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); sc numeric; tt numeric; ti text; nid bigint;
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ইমেইল দিয়ে লগইন করুন'; end if;
  if p_to is null or p_to=uid then raise exception 'নিজেকে চ্যালেঞ্জ করা যায় না'; end if;
  if not exists(select 1 from public.friend_profiles where user_id=p_to and visible) then raise exception 'এই বন্ধুকে এখন চ্যালেঞ্জ করা যাচ্ছে না'; end if;
  if (select count(*) from public.friend_challenges where from_user=uid and created_at>now()-interval '1 day')>=15 then raise exception 'আজকের চ্যালেঞ্জ পাঠানোর সীমা শেষ'; end if;
  if exists(select 1 from public.friend_challenges where status='pending' and kind='exam' and exam_id=p_exam
            and ((from_user=uid and to_user=p_to) or (from_user=p_to and to_user=uid))) then
    raise exception 'এই পরীক্ষায় তোমাদের মধ্যে চ্যালেঞ্জ আগে থেকেই চলছে';
  end if;
  select r.score,r.total into sc,tt from public.results r
    where r.user_id=uid and r.exam_id=p_exam and r.total>0 order by r.score::numeric/r.total desc limit 1;
  if not found then raise exception 'আগে পরীক্ষাটি নিজে দিন, তারপর চ্যালেঞ্জ পাঠান'; end if;
  select title into ti from public.exams where id=p_exam;
  insert into public.friend_challenges(from_user,to_user,kind,exam_id,title,from_score,from_max)
  values(uid,p_to,'exam',p_exam,coalesce(ti,'পরীক্ষা'),sc,tt) returning id into nid;
  return nid;
end $f$;

create or replace function public.friend_challenge_game(p_to uuid,p_game text,p_title text,p_score numeric,p_max numeric) returns bigint
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); nid bigint;
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ইমেইল দিয়ে লগইন করুন'; end if;
  if p_to is null or p_to=uid then raise exception 'নিজেকে চ্যালেঞ্জ করা যায় না'; end if;
  if not exists(select 1 from public.friend_profiles where user_id=p_to and visible) then raise exception 'এই বন্ধুকে এখন চ্যালেঞ্জ করা যাচ্ছে না'; end if;
  if p_max is null or p_max<=0 or p_score is null or p_score<0 or p_score>p_max then raise exception 'স্কোর সঠিক নয়'; end if;
  if (select count(*) from public.friend_challenges where from_user=uid and created_at>now()-interval '1 day')>=15 then raise exception 'আজকের চ্যালেঞ্জ পাঠানোর সীমা শেষ'; end if;
  if exists(select 1 from public.friend_challenges where status='pending' and kind='game' and game=p_game
            and ((from_user=uid and to_user=p_to) or (from_user=p_to and to_user=uid))) then
    raise exception 'এই গেমে তোমাদের মধ্যে চ্যালেঞ্জ আগে থেকেই চলছে';
  end if;
  insert into public.friend_challenges(from_user,to_user,kind,game,title,from_score,from_max)
  values(uid,p_to,'game',left(p_game,40),left(coalesce(p_title,p_game),60),p_score,p_max) returning id into nid;
  return nid;
end $f$;

create or replace function public.friend_game_reply(p_id bigint,p_score numeric,p_max numeric) returns void
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid();
begin
  if uid is null then raise exception 'লগইন করুন'; end if;
  if p_max is null or p_max<=0 or p_score is null or p_score<0 or p_score>p_max then raise exception 'স্কোর সঠিক নয়'; end if;
  if not exists(select 1 from public.friend_challenges where id=p_id and to_user=uid and kind='game' and status='pending') then
    raise exception 'এই চ্যালেঞ্জ আর খোলা নেই';
  end if;
  perform public._friend_finish(p_id,p_score,p_max);
end $f$;

create or replace function public.friend_decline(p_id bigint) returns void
language plpgsql security definer set search_path to 'public' as $f$
begin
  update public.friend_challenges set status='declined',done_at=now()
  where id=p_id and status='pending' and (to_user=auth.uid() or from_user=auth.uid());
end $f$;

create or replace function public.friend_challenges()
returns table(c_id bigint,c_kind text,c_title text,c_game text,c_exam bigint,c_from uuid,c_to uuid,c_from_name text,c_from_avatar text,c_to_name text,c_to_avatar text,
              c_from_score numeric,c_from_max numeric,c_to_score numeric,c_to_max numeric,c_status text,c_winner uuid,c_created timestamptz)
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); r record; rs record;
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ফ্রেন্ড জোনে ঢুকতে ইমেইল দিয়ে লগইন করুন'; end if;
  -- পরীক্ষার চ্যালেঞ্জ: বন্ধু চ্যালেঞ্জের পরে পরীক্ষা দিয়ে থাকলে নিজে থেকেই ফলাফল মিলিয়ে দেওয়া হয়
  for r in select c.id,c.exam_id,c.to_user,c.created_at from public.friend_challenges c
           where c.kind='exam' and c.status='pending' and (c.to_user=uid or c.from_user=uid) loop
    select res.score,res.total into rs from public.results res
      where res.user_id=r.to_user and res.exam_id=r.exam_id and res.created_at>r.created_at and res.total>0
      order by res.score::numeric/res.total desc limit 1;
    if found then perform public._friend_finish(r.id,rs.score,rs.total); end if;
  end loop;
  return query
  select c.id,c.kind,c.title,c.game,c.exam_id,c.from_user,c.to_user,
    coalesce(pf.name,'শিক্ষার্থী'),pf.avatar,coalesce(pt.name,'শিক্ষার্থী'),pt.avatar,
    c.from_score,c.from_max,c.to_score,c.to_max,c.status,c.winner,c.created_at
  from public.friend_challenges c
  left join public.friend_profiles pf on pf.user_id=c.from_user
  left join public.friend_profiles pt on pt.user_id=c.to_user
  where (c.from_user=uid or c.to_user=uid) and c.status<>'declined'
  order by c.id desc limit 60;
end $f$;

revoke all on function public.friend_sync(text,text,jsonb,int,int) from public,anon;

</script>
<script type="text/plain" id="v6-sql">
-- ===== ⑪ ফ্রেন্ড রিকুয়েস্ট + সবাইকে ফ্রেন্ড জোনে দেখানো — একবার Run করুন (আগে ⑩ Run করা থাকতে হবে) =====

-- ১) বন্ধুত্ব / অনুরোধের টেবিল
create table if not exists public.friend_links(
  id bigserial primary key,
  from_user uuid not null references auth.users(id) on delete cascade,
  to_user uuid not null references auth.users(id) on delete cascade,
  status text not null default 'pending' check (status in ('pending','accepted')),
  created_at timestamptz not null default now(), responded_at timestamptz,
  check (from_user<>to_user));
create unique index if not exists friend_links_pair_uq on public.friend_links(least(from_user,to_user),greatest(from_user,to_user));
create index if not exists friend_links_to_idx on public.friend_links(to_user,status);
alter table public.friend_links enable row level security;

-- ২) তালিকায় বন্ধুত্বের অবস্থা যোগ (none / sent / received / friends / me)
drop function if exists public.friend_list(text);
create function public.friend_list(p_q text default null)
returns table(f_id uuid,f_name text,f_avatar text,f_xp int,f_level int,f_streak int,f_std jsonb,f_rare jsonb,f_wins int,f_losses int,f_me boolean,f_vis boolean,f_rel text,f_link bigint)
language plpgsql security definer set search_path to 'public' as $f$
begin
  if auth.uid() is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ফ্রেন্ড জোনে ঢুকতে ইমেইল দিয়ে লগইন করুন'; end if;
  return query
  select p.user_id,p.name,p.avatar,p.xp,p.level,p.max_streak,p.std_badges,p.rare_badges,
    (select count(*)::int from public.friend_challenges c where c.status='done' and c.winner=p.user_id),
    (select count(*)::int from public.friend_challenges c where c.status='done' and c.winner is not null and c.winner<>p.user_id and (c.from_user=p.user_id or c.to_user=p.user_id)),
    (p.user_id=auth.uid()),p.visible,
    (case when p.user_id=auth.uid() then 'me'
          when l.id is null then 'none'
          when l.status='accepted' then 'friends'
          when l.from_user=auth.uid() then 'sent'
          else 'received' end)::text,
    l.id
  from public.friend_profiles p
  left join public.friend_links l on (l.from_user=auth.uid() and l.to_user=p.user_id) or (l.to_user=auth.uid() and l.from_user=p.user_id)
  where (p.visible or p.user_id=auth.uid() or l.status='accepted')
    and (p_q is null or btrim(p_q)='' or p.name ilike '%'||btrim(p_q)||'%')
  order by (p.user_id=auth.uid()) desc, (l.status='pending' and l.to_user=auth.uid()) desc, p.xp desc, p.name
  limit 500;
end $f$;

-- ৩) বন্ধুর অনুরোধ পাঠানো (সে আগেই পাঠিয়ে থাকলে সরাসরি বন্ধু হয়ে যায়)
create or replace function public.friend_request(p_to uuid) returns text
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); l public.friend_links;
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ইমেইল দিয়ে লগইন করুন'; end if;
  if p_to is null or p_to=uid then raise exception 'নিজেকে বন্ধু করা যায় না'; end if;
  if not exists(select 1 from public.friend_profiles where user_id=p_to and visible) then raise exception 'এই ব্যবহারকারীকে এখন অনুরোধ পাঠানো যাচ্ছে না'; end if;
  select * into l from public.friend_links where (from_user=uid and to_user=p_to) or (from_user=p_to and to_user=uid);
  if found then
    if l.status='accepted' then return 'friends'; end if;
    if l.from_user=p_to then
      update public.friend_links set status='accepted',responded_at=now() where id=l.id;
      return 'friends';
    end if;
    return 'sent';
  end if;
  if (select count(*) from public.friend_links where from_user=uid and created_at>now()-interval '1 day')>=30 then raise exception 'আজকের অনুরোধ পাঠানোর সীমা শেষ'; end if;
  insert into public.friend_links(from_user,to_user) values(uid,p_to);
  return 'sent';
end $f$;

-- ৪) অনুরোধ গ্রহণ / বাদ
create or replace function public.friend_respond(p_id bigint,p_accept boolean) returns void
language plpgsql security definer set search_path to 'public' as $f$
begin
  if auth.uid() is null then return; end if;
  if p_accept then
    update public.friend_links set status='accepted',responded_at=now() where id=p_id and to_user=auth.uid() and status='pending';
  else
    delete from public.friend_links where id=p_id and to_user=auth.uid() and status='pending';
  end if;
end $f$;

-- ৫) অনুরোধ বাতিল / বন্ধুত্ব শেষ
create or replace function public.friend_remove(p_id bigint) returns void
language plpgsql security definer set search_path to 'public' as $f$
begin
  if auth.uid() is null then return; end if;
  delete from public.friend_links where id=p_id and (from_user=auth.uid() or to_user=auth.uid());
end $f$;

revoke all on function public.friend_list(text) from public,anon;
revoke all on function public.friend_request(uuid) from public,anon;
revoke all on function public.friend_respond(bigint,boolean) from public,anon;
revoke all on function public.friend_remove(bigint) from public,anon;
grant execute on function public.friend_list(text) to authenticated;
grant execute on function public.friend_request(uuid) to authenticated;
grant execute on function public.friend_respond(bigint,boolean) to authenticated;
grant execute on function public.friend_remove(bigint) to authenticated;

-- ৬) যারা আগে থেকেই লগইন করা (ইমেইল দিয়ে), সবাইকে এখনই ফ্রেন্ড জোনে তুলে দেওয়া
--    (তাদের ব্যাজ/XP পুরোপুরি মিলবে তখনই, যখন তারা অ্যাপ খুলবে; তার আগে আনুমানিক দেখাবে)
insert into public.friend_profiles(user_id,name,avatar,xp,level,max_streak,std_badges,rare_badges)
select u.id,
       left(coalesce(nullif(btrim(u.raw_user_meta_data->>'full_name'),''),'শিক্ষার্থী'),40),
       left(coalesce(nullif(u.raw_user_meta_data->>'avatar',''),'🙂'),8),
       0,1,0,'[]'::jsonb,'[]'::jsonb
from auth.users u
where u.email is not null and coalesce(u.is_anonymous,false)=false
on conflict(user_id) do nothing;

create or replace function public._friend_refresh(p_user uuid) returns void
language plpgsql security definer set search_path to 'public' as $f$
declare ms int := 0; rb jsonb := '[]'::jsonb; xs int := 0;
begin
  begin
    select coalesce(max(c),0) into ms from (
      select count(*) c from (
        select dt, dt-(row_number() over(order by dt))::int g from (
          select (created_at at time zone 'Asia/Dhaka')::date dt from public.results where user_id=p_user
          union
          select (created_at at time zone 'Asia/Dhaka')::date from public.daily_runs where user_id=p_user) d) x
      group by g) y;
  exception when others then
    begin
      select coalesce(max(c),0) into ms from (
        select count(*) c from (
          select dt, dt-(row_number() over(order by dt))::int g from (
            select distinct (created_at at time zone 'Asia/Dhaka')::date dt from public.results where user_id=p_user) d) x
        group by g) y;
    exception when others then ms := 0; end;
  end;
  begin
    select coalesce(jsonb_agg(jsonb_build_object('e',left(coalesce(r.emoji,'🏅'),8),'t',left(coalesce(r.title,''),40)) order by r.id),'[]'::jsonb)
      into rb from public.user_badges ub join public.rare_badges r on r.id=ub.badge_id where ub.user_id=p_user;
  exception when others then rb := '[]'::jsonb; end;
  begin
    select coalesce(sum(score*10+20),0)::int into xs from public.results where user_id=p_user;
    begin xs := xs + coalesce((select sum(xp) from public.daily_runs where user_id=p_user),0)::int; exception when others then null; end;
  exception when others then xs := 0; end;
  update public.friend_profiles set
    max_streak=greatest(max_streak,ms),
    rare_badges=case when jsonb_array_length(rare_badges)=0 then rb else rare_badges end,
    level=case when xp=0 then floor(sqrt(xs/50.0))::int+1 else level end,
    xp=case when xp=0 then xs else xp end
  where user_id=p_user;
end $f$;
revoke all on function public._friend_refresh(uuid) from public,anon,authenticated;
select public._friend_refresh(user_id) from public.friend_profiles;
</script>
<script type="text/plain" id="v7-sql">
-- ===== ⑫ প্রোফাইল ছবি + বন্ধুকে প্রতিদিন কয়েন গিফট — একবার Run করুন (আগে ⑩ ও ⑪ Run করা থাকতে হবে) =====
-- বারবার Run করলেও সমস্যা নেই। আগের কোনো টেবিল/ডেটা মুছে না।

-- ১) প্রোফাইল ছবি (ছোট ৮০×৮০ ছবি) রাখার ঘর
alter table public.friend_profiles add column if not exists photo text;

create or replace function public.avatar_photo_set(p_photo text) returns void
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); ph text := nullif(btrim(coalesce(p_photo,'')),'');
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ইমেইল দিয়ে লগইন করুন'; end if;
  if ph is not null and (length(ph)>30000 or ph !~ '^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$') then raise exception 'ছবিটি সঠিক নয় বা বেশি বড়'; end if;
  update public.friend_profiles set photo=ph where user_id=uid;
  if not found then
    insert into public.friend_profiles(user_id,name,avatar,photo)
    values(uid,left(coalesce(nullif(btrim(auth.jwt()->'user_metadata'->>'full_name'),''),'শিক্ষার্থী'),40),'🙂',ph);
  end if;
end $f$;

create or replace function public.my_avatar_photo() returns text
language sql stable security definer set search_path to 'public' as $f$
  select photo from public.friend_profiles where user_id=auth.uid() $f$;

-- ২) ফ্রেন্ড জোনের তালিকা ও চ্যালেঞ্জে ছবি থাকলে ছবি, না থাকলে ইমোজি
create or replace function public.friend_list(p_q text default null)
returns table(f_id uuid,f_name text,f_avatar text,f_xp int,f_level int,f_streak int,f_std jsonb,f_rare jsonb,f_wins int,f_losses int,f_me boolean,f_vis boolean,f_rel text,f_link bigint)
language plpgsql security definer set search_path to 'public' as $f$
begin
  if auth.uid() is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ফ্রেন্ড জোনে ঢুকতে ইমেইল দিয়ে লগইন করুন'; end if;
  return query
  select p.user_id,p.name,coalesce(p.photo,p.avatar),p.xp,p.level,p.max_streak,p.std_badges,p.rare_badges,
    (select count(*)::int from public.friend_challenges c where c.status='done' and c.winner=p.user_id),
    (select count(*)::int from public.friend_challenges c where c.status='done' and c.winner is not null and c.winner<>p.user_id and (c.from_user=p.user_id or c.to_user=p.user_id)),
    (p.user_id=auth.uid()),p.visible,
    (case when p.user_id=auth.uid() then 'me'
          when l.id is null then 'none'
          when l.status='accepted' then 'friends'
          when l.from_user=auth.uid() then 'sent'
          else 'received' end)::text,
    l.id
  from public.friend_profiles p
  left join public.friend_links l on (l.from_user=auth.uid() and l.to_user=p.user_id) or (l.to_user=auth.uid() and l.from_user=p.user_id)
  where (p.visible or p.user_id=auth.uid() or l.status='accepted')
    and (p_q is null or btrim(p_q)='' or p.name ilike '%'||btrim(p_q)||'%')
  order by (p.user_id=auth.uid()) desc, (l.status='pending' and l.to_user=auth.uid()) desc, p.xp desc, p.name
  limit 500;
end $f$;

create or replace function public.friend_challenges()
returns table(c_id bigint,c_kind text,c_title text,c_game text,c_exam bigint,c_from uuid,c_to uuid,c_from_name text,c_from_avatar text,c_to_name text,c_to_avatar text,
              c_from_score numeric,c_from_max numeric,c_to_score numeric,c_to_max numeric,c_status text,c_winner uuid,c_created timestamptz)
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); r record; rs record;
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ফ্রেন্ড জোনে ঢুকতে ইমেইল দিয়ে লগইন করুন'; end if;
  -- পরীক্ষার চ্যালেঞ্জ: বন্ধু চ্যালেঞ্জের পরে পরীক্ষা দিয়ে থাকলে নিজে থেকেই ফলাফল মিলিয়ে দেওয়া হয়
  for r in select c.id,c.exam_id,c.to_user,c.created_at from public.friend_challenges c
           where c.kind='exam' and c.status='pending' and (c.to_user=uid or c.from_user=uid) loop
    select res.score,res.total into rs from public.results res
      where res.user_id=r.to_user and res.exam_id=r.exam_id and res.created_at>r.created_at and res.total>0
      order by res.score::numeric/res.total desc limit 1;
    if found then perform public._friend_finish(r.id,rs.score,rs.total); end if;
  end loop;
  return query
  select c.id,c.kind,c.title,c.game,c.exam_id,c.from_user,c.to_user,
    coalesce(pf.name,'শিক্ষার্থী'),coalesce(pf.photo,pf.avatar),coalesce(pt.name,'শিক্ষার্থী'),coalesce(pt.photo,pt.avatar),
    c.from_score,c.from_max,c.to_score,c.to_max,c.status,c.winner,c.created_at
  from public.friend_challenges c
  left join public.friend_profiles pf on pf.user_id=c.from_user
  left join public.friend_profiles pt on pt.user_id=c.to_user
  where (c.from_user=uid or c.to_user=uid) and c.status<>'declined'
  order by c.id desc limit 60;
end $f$;

-- ৩) বন্ধুকে প্রতিদিন কয়েন গিফট (প্রত্যেক বন্ধুকে দিনে একবার; কয়েন নিজের ওয়ালেট থেকে কাটা যায়)
insert into public.ai_config(key,val) values ('friend_gift_coin',5) on conflict(key) do nothing;

create table if not exists public.friend_gifts(
  id bigserial primary key,
  from_user uuid not null references auth.users(id) on delete cascade,
  to_user uuid not null references auth.users(id) on delete cascade,
  amount int not null check (amount>0),
  day date not null default ((now() at time zone 'Asia/Dhaka')::date),
  created_at timestamptz not null default now(),
  unique(from_user,to_user,day));
create index if not exists friend_gifts_to_idx on public.friend_gifts(to_user,day);
alter table public.friend_gifts enable row level security;
-- (কোনো policy নেই: সব কাজ নিচের নিরাপদ ফাংশনের মাধ্যমে হয়)

create or replace function public._friend_gift_one(p_from uuid,p_to uuid,p_amt int) returns void
language plpgsql security definer set search_path to 'public' as $f$
declare w public.coin_wallet%rowtype;
begin
  insert into public.coin_wallet(user_id) values(p_from) on conflict do nothing;
  select * into w from public.coin_wallet where user_id=p_from for update;
  if w.balance<p_amt then raise exception 'গিফট দিতে কমপক্ষে % কয়েন লাগবে (আপনার আছে %)',p_amt,w.balance; end if;
  begin
    insert into public.friend_gifts(from_user,to_user,amount) values(p_from,p_to,p_amt);
  exception when unique_violation then raise exception 'আজ এই বন্ধুকে ইতিমধ্যে গিফট দিয়েছেন, কাল আবার দিতে পারবেন'; end;
  update public.coin_wallet set balance=balance-p_amt,updated_at=now() where user_id=p_from;
  insert into public.coin_log(user_id,delta,reason) values(p_from,-p_amt,'friend_gift_sent');
  perform public._coin_add(p_to,p_amt,'friend_gift',null);
end $f$;
revoke all on function public._friend_gift_one(uuid,uuid,int) from public,anon,authenticated;

create or replace function public.friend_gift_coins(p_to uuid) returns int
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); amt int := coalesce(public._cfg('friend_gift_coin'),5);
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ইমেইল দিয়ে লগইন করুন'; end if;
  if p_to is null or p_to=uid then raise exception 'নিজেকে গিফট দেওয়া যায় না'; end if;
  if not exists(select 1 from public.friend_links l where l.status='accepted' and ((l.from_user=uid and l.to_user=p_to) or (l.to_user=uid and l.from_user=p_to))) then
    raise exception 'শুধু বন্ধুদেরই গিফট দেওয়া যায়'; end if;
  perform public._friend_gift_one(uid,p_to,amt);
  return amt;
end $f$;

create or replace function public.friend_gift_all() returns jsonb
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); amt int := coalesce(public._cfg('friend_gift_coin'),5); r record; n int := 0;
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ইমেইল দিয়ে লগইন করুন'; end if;
  for r in
    select case when l.from_user=uid then l.to_user else l.from_user end as fid
    from public.friend_links l
    where l.status='accepted' and (l.from_user=uid or l.to_user=uid)
      and not exists(select 1 from public.friend_gifts g where g.from_user=uid
        and g.to_user=(case when l.from_user=uid then l.to_user else l.from_user end)
        and g.day=((now() at time zone 'Asia/Dhaka')::date))
  loop
    begin
      perform public._friend_gift_one(uid,r.fid,amt); n := n+1;
    exception when others then exit; end;
  end loop;
  return jsonb_build_object('sent',n,'cost',n*amt);
end $f$;

create or replace function public.friend_gift_info() returns jsonb
language plpgsql stable security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); d date := ((now() at time zone 'Asia/Dhaka')::date);
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'ইমেইল দিয়ে লগইন করুন'; end if;
  return jsonb_build_object(
    'amt',coalesce(public._cfg('friend_gift_coin'),5),
    'bal',coalesce((select balance from public.coin_wallet where user_id=uid),0),
    'sent',coalesce((select jsonb_agg(to_user) from public.friend_gifts where from_user=uid and day=d),'[]'::jsonb),
    'recv_n',(select count(*) from public.friend_gifts where to_user=uid and day=d),
    'recv_c',coalesce((select sum(amount) from public.friend_gifts where to_user=uid and day=d),0));
end $f$;

revoke all on function public.avatar_photo_set(text) from public,anon;
revoke all on function public.my_avatar_photo() from public,anon;
revoke all on function public.friend_gift_coins(uuid) from public,anon;
revoke all on function public.friend_gift_all() from public,anon;
revoke all on function public.friend_gift_info() from public,anon;
grant execute on function public.avatar_photo_set(text) to authenticated;
grant execute on function public.my_avatar_photo() to authenticated;
grant execute on function public.friend_list(text) to authenticated;
grant execute on function public.friend_challenges() to authenticated;
grant execute on function public.friend_gift_coins(uuid) to authenticated;
grant execute on function public.friend_gift_all() to authenticated;
grant execute on function public.friend_gift_info() to authenticated;

create table if not exists public.xg_questions(

create table if not exists public.xg_sessions(

create table if not exists public.xg_runs(

alter table public.xg_runs enable row level security;

-- পার্থক্য খুঁজো: একটি রাউন্ডের দুই সারি ইমোজি বানায় (পার্থক্যের ঘর ০ থেকে গোনা)
create or replace function public._xg_spot_round(n int,k int) returns jsonb
language plpgsql security definer set search_path to 'public' as $f$
declare pool text[] := array['🍎','🍌','🍇','🍉','🍓','🍒','🍍','🥝','🍋','🍑','🥕','🌽','🍄','⭐','🌙','🌈','🔥','💧','🍀','🌸','🐟','🐢','🐞','🐝','🦋','🎈'];
  a text[] := '{}'; b text[]; d int[] := '{}'; i int; idx int; e text; pn int := array_length(pool,1);
begin
  for i in 1..n loop a := a || pool[1+floor(random()*pn)::int]; end loop;
  b := a;
  while coalesce(array_length(d,1),0)<k loop
    idx := 1+floor(random()*n)::int;
    if not ((idx-1) = any(d)) then
      loop
        e := pool[1+floor(random()*pn)::int];
        exit when e<>a[idx];
      end loop;
      b[idx] := e; d := d||(idx-1);
    end if;
  end loop;
  return jsonb_build_object('a',to_jsonb(a),'b',to_jsonb(b),'d',to_jsonb(d));
end $f$;
revoke all on function public._xg_spot_round(int,int) from public,anon,authenticated;

create or replace function public.xg_start(p_game text) returns jsonb
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); sid uuid; its jsonb := '[]'::jsonb; ks jsonb := '[]'::jsonb;
  ns int[] := array[16,16,20,20,25]; kk int[] := array[3,3,4,4,5]; i int; rd jsonb; r record;
  corr text; sh text[]; pos int; cnt int := 0;
begin
  if uid is null then raise exception 'আগে লগইন করুন'; end if;
  if p_game not in ('spot','bd','sci') then raise exception 'গেমটি পাওয়া যায়নি'; end if;
  delete from public.xg_sessions where created_at<now()-interval '2 days';
  if p_game='spot' then
    for i in 1..5 loop
      rd := public._xg_spot_round(ns[i],kk[i]);
      its := its || jsonb_build_object('a',rd->'a','b',rd->'b','k',kk[i],'cols',case when ns[i]=16 then 4 else 5 end);
      ks := ks || jsonb_build_array(rd->'d');
    end loop;
  else
    for r in select q,clues,opts,ans from public.xg_questions
             where game=p_game and active order by random() limit (case when p_game='bd' then 8 else 6 end) loop
      corr := r.opts[r.ans+1];
      sh := array(select o from unnest(r.opts) o order by random());
      pos := array_position(sh,corr)-1;
      its := its || jsonb_build_object('q',r.q,'clues',coalesce(to_jsonb(r.clues),'[]'::jsonb),'opts',to_jsonb(sh));
      ks := ks || to_jsonb(pos);
      cnt := cnt+1;
    end loop;
    if cnt=0 then raise exception 'এই গেমের প্রশ্ন এখনও যোগ হয়নি'; end if;
  end if;
  insert into public.xg_sessions(user_id,game,key) values(uid,p_game,ks) returning id into sid;
  return jsonb_build_object('session',sid,'items',its);
end $f$;

create or replace function public.xg_submit(p_session uuid,p_answers jsonb) returns jsonb
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); s public.xg_sessions%rowtype; sc int := 0; mx int := 0; i int; t int; c int; w int; a jsonb;
  per int := coalesce(public._cfg('xg_coin_play'),10); cap int := coalesce(public._cfg('xg_coin_cap'),30);
  earned int; calc int; give int;
begin
  if uid is null then raise exception 'আগে লগইন করুন'; end if;
  select * into s from public.xg_sessions where id=p_session and user_id=uid for update;
  if not found then raise exception 'খেলার সেশন পাওয়া যায়নি'; end if;
  if s.done then raise exception 'এই খেলাটি আগেই জমা হয়েছে'; end if;
  if s.created_at<now()-interval '40 minutes' then raise exception 'সময় শেষ, আবার খেলুন'; end if;
  if p_answers is null or jsonb_typeof(p_answers)<>'array' or jsonb_array_length(p_answers)>20 then raise exception 'উত্তর সঠিক নয়'; end if;
  update public.xg_sessions set done=true where id=s.id;
  for i in 0..jsonb_array_length(s.key)-1 loop
    a := p_answers->i;
    if s.game='spot' then
      mx := mx + jsonb_array_length(s.key->i);
      c := 0; w := 0;
      if a is not null and jsonb_typeof(a)='array' then
        for t in select distinct v::int from jsonb_array_elements_text(a) v where v ~ '^[0-9]{1,3}$' loop
          if (s.key->i) @> to_jsonb(t) then c := c+1; else w := w+1; end if;
        end loop;
      end if;
      sc := sc + greatest(0,c-w);
    elsif s.game='bd' then
      mx := mx+1;
      if (p_answers->>i) is not null and (p_answers->>i)=(s.key->>i) then sc := sc+1; end if;
    else
      mx := mx+3;
      if a is not null and jsonb_typeof(a)='object' and (a->>'c')~'^[0-9]$' and (a->>'u')~'^[1-3]$'
         and (a->>'c')=(s.key->>i) then
        sc := sc + 4 - (a->>'u')::int;
      end if;
    end if;
  end loop;
  select coalesce(sum(coins),0) into earned from public.xg_runs
   where user_id=uid and game=s.game and day=((now() at time zone 'Asia/Dhaka')::date);
  calc := case when mx>0 then round(per*sc::numeric/mx)::int else 0 end;
  give := least(calc,greatest(0,cap-earned));
  insert into public.xg_runs(user_id,game,score,max,coins) values(uid,s.game,sc,mx,give);
  if give>0 then perform public._coin_add(uid,give,'xgame_'||s.game,null); end if;
  return jsonb_build_object('score',sc,'max',mx,'coins',give,'capped',(calc>0 and give<calc),'key',s.key);
end $f$;

create or replace function public.xg_menu() returns jsonb
language plpgsql stable security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); cap int := coalesce(public._cfg('xg_coin_cap'),30); g text; r jsonb := '[]'::jsonb;
  d date := ((now() at time zone 'Asia/Dhaka')::date);
begin
  if uid is null then raise exception 'আগে লগইন করুন'; end if;
  foreach g in array array['spot','bd','sci'] loop
    r := r || jsonb_build_object('game',g,
      'left',greatest(0,cap-coalesce((select sum(coins) from public.xg_runs where user_id=uid and game=g and day=d),0)),
      'best',(select max(score) from public.xg_runs where user_id=uid and game=g));
  end loop;
  return r;
end $f$;

revoke all on function public.xg_start(text) from public,anon;
revoke all on function public.xg_submit(uuid,jsonb) from public,anon;
revoke all on function public.xg_menu() from public,anon;
grant execute on function public.xg_start(text) to authenticated;
grant execute on function public.xg_submit(uuid,jsonb) to authenticated;
grant execute on function public.xg_menu() to authenticated;
</script>

-- ===== ⑮ অফলাইন উত্তরপত্র: শিক্ষার্থী নিজে স্ক্যান করে ফলাফল জমা — একবার Run করুন (আগে ⑭ Run করা থাকতে হবে) =====
-- বারবার Run করলেও সমস্যা নেই। আগের কোনো টেবিল/ডেটা মুছে না।

alter table public.offline_sheets add column if not exists result_id text;

-- ১) স্ক্যান করা QR-এর কোড থেকে সেটের তথ্য (শুধু লগইন করা স্টুডেন্ট; উত্তরের চাবি কখনও দেওয়া হয় না)
create or replace function public.offline_sheet_info(p_code text) returns jsonb
language plpgsql security definer set search_path=public as $f$
declare r public.offline_sheets;
begin
  if auth.uid() is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then
    raise exception 'আগে নিজের আইডি দিয়ে লগইন করুন';
  end if;
  select * into r from public.offline_sheets where code=upper(trim(p_code));
  if not found then raise exception 'এই কোডের কোনো উত্তরপত্র পাওয়া যায়নি'; end if;
  if r.user_id is not null and r.user_id<>auth.uid() then
    return jsonb_build_object('taken',true);
  end if;
  return jsonb_build_object('taken',false,'code',r.code,'exam_id',r.exam_id,'exam_title',r.exam_title,
    'perm',r.perm,'roll',r.roll,'name',r.student_name,
    'done',(r.user_id=auth.uid() and r.result_id is not null),'result_id',r.result_id);
end $f$;

-- ২) উত্তরপত্রটি এই স্টুডেন্টের নামে দাবি করা (একটি উত্তরপত্র একজনই জমা দিতে পারবে)
create or replace function public.offline_sheet_claim(p_code text) returns text
language plpgsql security definer set search_path=public as $f$
begin

-- ---------- শুরু: নতুন দুই গেম যোগ, উত্তর সার্ভারে যাচাই ----------
create or replace function public.xg_start(p_game text) returns jsonb
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); sid uuid; its jsonb := '[]'::jsonb; ks jsonb := '[]'::jsonb;
  ns int[] := array[16,16,20,20,25]; kk int[] := array[3,3,4,4,5]; i int; rd jsonb; r record;
  corr text; sh text[]; pos int; cnt int := 0;
  n int; ord int[]; lf jsonb; rt jsonb; kq jsonb; k int; p jsonb;
begin
  if uid is null then raise exception 'আগে লগইন করুন'; end if;
  if p_game not in ('spot','bd','sci','match','slider') then raise exception 'গেমটি পাওয়া যায়নি'; end if;
  delete from public.xg_sessions where created_at<now()-interval '2 days';
  if p_game='spot' then
    for i in 1..5 loop
      rd := public._xg_spot_round(ns[i],kk[i]);
      its := its || jsonb_build_object('a',rd->'a','b',rd->'b','k',kk[i],'cols',case when ns[i]=16 then 4 else 5 end);
      ks := ks || jsonb_build_array(rd->'d');
    end loop;
  elsif p_game in ('bd','sci') then
    for r in select q,clues,opts,ans from public.xg_questions
             where game=p_game and active order by random() limit (case when p_game='bd' then 8 else 6 end) loop
      corr := r.opts[r.ans+1];
      sh := array(select o from unnest(r.opts) o order by random());
      pos := array_position(sh,corr)-1;
      its := its || jsonb_build_object('q',r.q,'clues',coalesce(to_jsonb(r.clues),'[]'::jsonb),'opts',to_jsonb(sh));
      ks := ks || to_jsonb(pos);
      cnt := cnt+1;
    end loop;
  elsif p_game='match' then
    for r in select payload from public.xg_ext where game='match' and active order by random() limit 4 loop
      p := r.payload; n := jsonb_array_length(p->'pairs');
      continue when n < 2;
      ord := array(select i0 from generate_series(0,n-1) i0 order by random());
      lf := '[]'::jsonb; rt := '[]'::jsonb; kq := '[]'::jsonb;
      for k in 0..n-1 loop lf := lf || jsonb_build_array(p->'pairs'->k->'a'); end loop;
      for k in 1..n loop rt := rt || jsonb_build_array(p->'pairs'->(ord[k])->'b'); end loop;
      for k in 0..n-1 loop kq := kq || jsonb_build_array(array_position(ord,k)-1); end loop;
      its := its || jsonb_build_object('kind','match','q',p->>'title','left',lf,'right',rt);
      ks := ks || jsonb_build_array(kq);
      cnt := cnt+1;
    end loop;
  elsif p_game='slider' then
    for r in select payload from public.xg_ext where game='slider' and active order by random() limit 5 loop
      p := r.payload;
      its := its || jsonb_build_object('kind','slider','q',p->>'q','min',p->'min','max',p->'max',
                                       'step',coalesce(p->'step',to_jsonb(1)),'unit',coalesce(p->>'unit',''));
      ks := ks || jsonb_build_array(jsonb_build_object('t',p->'target','tol',coalesce(p->'tol',to_jsonb(0))));
      cnt := cnt+1;
    end loop;
  end if;
  if p_game in ('match','slider') and cnt=0 then raise exception 'এই গেমের প্রশ্ন এখনও যোগ হয়নি'; end if;
  if p_game in ('bd','sci') and cnt=0 then raise exception 'এই গেমের প্রশ্ন এখনও যোগ হয়নি'; end if;
  insert into public.xg_sessions(user_id,game,key) values(uid,p_game,ks) returning id into sid;
  return jsonb_build_object('session',sid,'items',its);
end $f$;

create or replace function public.xg_submit(p_session uuid,p_answers jsonb) returns jsonb
language plpgsql security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); s public.xg_sessions%rowtype; sc int := 0; mx int := 0; i int; t int; c int; w int; a jsonb;
  per int := coalesce(public._cfg('xg_coin_play'),10); cap int := coalesce(public._cfg('xg_coin_cap'),30);
  earned int; calc int; give int; n int; dv numeric; tl numeric;
begin
  if uid is null then raise exception 'আগে লগইন করুন'; end if;
  select * into s from public.xg_sessions where id=p_session and user_id=uid for update;
  if not found then raise exception 'খেলার সেশন পাওয়া যায়নি'; end if;
  if s.done then raise exception 'এই খেলাটি আগেই জমা হয়েছে'; end if;
  if s.created_at<now()-interval '40 minutes' then raise exception 'সময় শেষ, আবার খেলুন'; end if;
  if p_answers is null or jsonb_typeof(p_answers)<>'array' or jsonb_array_length(p_answers)>20 then raise exception 'উত্তর সঠিক নয়'; end if;
  update public.xg_sessions set done=true where id=s.id;
  for i in 0..jsonb_array_length(s.key)-1 loop
    a := p_answers->i;
    if s.game='spot' then
      mx := mx + jsonb_array_length(s.key->i);
      c := 0; w := 0;
      if a is not null and jsonb_typeof(a)='array' then
        for t in select distinct v::int from jsonb_array_elements_text(a) v where v ~ '^[0-9]{1,3}$' loop
          if (s.key->i) @> to_jsonb(t) then c := c+1; else w := w+1; end if;
        end loop;
      end if;
      sc := sc + greatest(0,c-w);
    elsif s.game='bd' then
      mx := mx+1;
      if (p_answers->>i) is not null and (p_answers->>i)=(s.key->>i) then sc := sc+1; end if;
    elsif s.game='sci' then
      mx := mx+3;
      if a is not null and jsonb_typeof(a)='object' and (a->>'c')~'^[0-9]$' and (a->>'u')~'^[1-3]$'
         and (a->>'c')=(s.key->>i) then
        sc := sc + 4 - (a->>'u')::int;
      end if;
    elsif s.game='match' then
      n := jsonb_array_length(s.key->i);
      mx := mx + n;
      if a is not null and jsonb_typeof(a)='array' then
        for t in 0..n-1 loop
          if (a->>t) is not null and (a->>t)=((s.key->i)->>t) then sc := sc+1; end if;
        end loop;
      end if;
    else
      mx := mx+2;
      if a is not null and jsonb_typeof(a)='number' then
        dv := abs((a#>>'{}')::numeric - ((s.key->i)->>'t')::numeric);
        tl := ((s.key->i)->>'tol')::numeric;
        if dv<=tl then sc := sc+2;
        elsif dv<=greatest(tl*3,1) then sc := sc+1;
        end if;
      end if;
    end if;
  end loop;
  select coalesce(sum(coins),0) into earned from public.xg_runs
   where user_id=uid and game=s.game and day=((now() at time zone 'Asia/Dhaka')::date);
  calc := case when mx>0 then round(per*sc::numeric/mx)::int else 0 end;
  give := least(calc,greatest(0,cap-earned));
  insert into public.xg_runs(user_id,game,score,max,coins) values(uid,s.game,sc,mx,give);
  if give>0 then perform public._coin_add(uid,give,'xgame_'||s.game,null); end if;
  return jsonb_build_object('score',sc,'max',mx,'coins',give,'capped',(calc>0 and give<calc),'key',s.key);
end $f$;

create or replace function public.xg_menu() returns jsonb
language plpgsql stable security definer set search_path to 'public' as $f$
declare uid uuid := auth.uid(); cap int := coalesce(public._cfg('xg_coin_cap'),30); g text; r jsonb := '[]'::jsonb;
  d date := ((now() at time zone 'Asia/Dhaka')::date);
begin
  if uid is null then raise exception 'আগে লগইন করুন'; end if;
  foreach g in array array['spot','bd','sci','match','slider'] loop
    r := r || jsonb_build_object('game',g,
      'left',greatest(0,cap-coalesce((select sum(coins) from public.xg_runs where user_id=uid and game=g and day=d),0)),
      'best',(select max(score) from public.xg_runs where user_id=uid and game=g));
  end loop;
  return r;
end $f$;

revoke all on function public.xg_start(text) from public,anon;
revoke all on function public.xg_submit(uuid,jsonb) from public,anon;
revoke all on function public.xg_menu() from public,anon;
grant execute on function public.xg_start(text) to authenticated;
grant execute on function public.xg_submit(uuid,jsonb) to authenticated;
grant execute on function public.xg_menu() to authenticated;

</script>

language plpgsql security definer set search_path=public as $f$

-- ---------- ২) ai_charge / ai_refund: এখন 'explain'-ও চলবে ----------
create or replace function public.ai_charge(p_user uuid,p_kind text) returns text
language plpgsql security definer set search_path=public as $f$
declare w public.coin_wallet%rowtype; free int; used int; cost int;
begin
  if p_kind not in ('doubt','tutor','explain') then raise exception 'bad kind'; end if;
  insert into public.coin_wallet(user_id) values(p_user) on conflict do nothing;
  select * into w from public.coin_wallet where user_id=p_user for update;
  free:=coalesce(public._cfg(p_kind||'_free'),0);
  select count(*) into used from public.usage_log where user_id=p_user and kind=p_kind and day=(now() at time zone 'Asia/Dhaka')::date;
  if used<free then insert into public.usage_log(user_id,kind) values(p_user,p_kind); return 'free'; end if;
  if p_kind='doubt' and w.doubt_credits>0 then
    update public.coin_wallet set doubt_credits=doubt_credits-1,updated_at=now() where user_id=p_user;
    insert into public.usage_log(user_id,kind) values(p_user,p_kind); return 'credit'; end if;
  if p_kind='tutor' and w.tutor_boost>0 then
    update public.coin_wallet set tutor_boost=tutor_boost-1,updated_at=now() where user_id=p_user;
    insert into public.usage_log(user_id,kind) values(p_user,p_kind); return 'credit'; end if;
  cost:=coalesce(public._cfg(p_kind||'_cost'),0);
  if cost>0 and w.balance>=cost then
    update public.coin_wallet set balance=balance-cost,updated_at=now() where user_id=p_user;
    insert into public.coin_log(user_id,delta,reason) values(p_user,-cost,'AI '||p_kind);

create or replace function public.my_ai_status() returns jsonb
language plpgsql security definer set search_path=public stable as $f$

-- ---------- ৪) রেফারেল কয়েন (referrals টেবিলের কলামের নাম নিজে থেকে চিনে নেয়) ----------
create or replace function public.trg_coin_referral() returns trigger language plpgsql security definer set search_path=public as $f$
declare j jsonb:=to_jsonb(new); referred uuid; referrer uuid; k text; v text; a int; b int;
begin
  begin
    for k,v in select key,value from jsonb_each_text(j) loop
      if v ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' then
        if k in ('referred','referred_id','referred_user','referee','referee_id','new_user','invitee','invitee_id') then referred:=v::uuid;
        elsif k in ('referrer','referrer_id','referrer_user','referred_by','inviter','inviter_id','ref_by','owner','owner_id','user_id') then referrer:=coalesce(referrer,v::uuid);
        end if;
      end if;
    end loop;
    if referrer is null then
      for k,v in select key,value from jsonb_each_text(j) loop
        if k<>'id' and v ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
           and (referred is null or v::uuid<>referred) and exists(select 1 from auth.users where id=v::uuid) then
          referrer:=v::uuid; exit;
        end if;
      end loop;
    end if;
    if referred is null or referrer is null or referred=referrer then return new; end if;
    a:=coalesce(public._cfg('ref_reward_referrer'),0);
    b:=coalesce(public._cfg('ref_reward_new'),0);
    if a>0 then perform public._coin_add(referrer,a,'রেফারেল পুরস্কার','rf:'||referred::text); end if;
    if b>0 then perform public._coin_add(referred,b,'রেফারেল স্বাগত বোনাস','rfn:'||referred::text); end if;
  exception when others then null;
  end;
  return new;
end $f$;
revoke all on function public.trg_coin_referral() from public,anon,authenticated;
do $f$ begin
  if to_regclass('public.referrals') is not null then
    drop trigger if exists coin_on_referral on public.referrals;
    create trigger coin_on_referral after insert on public.referrals for each row execute function public.trg_coin_referral();
  end if;
end $f$;

// ===== ⑰ নতুন গেমের AI কন্টেন্ট (api/wa.js) — প্রতিদিন নতুন জোড়া ও স্লাইডার প্রশ্ন =====

const XG_THEMES = ['ধাতু ও রসায়ন', 'বাংলাদেশের ইতিহাস', 'গণিত ও জ্যামিতি', 'বিজ্ঞান ও প্রকৃতি', 'ভূগোল ও পরিবেশ', 'সাধারণ জ্ঞান'];
function xgValidMatch(x) {
  if (!x || typeof x.title !== 'string' || !Array.isArray(x.pairs)) return null;
  const pr = x.pairs
    .filter((p) => p && typeof p.a === 'string' && typeof p.b === 'string' && p.a.trim() && p.b.trim() && p.a.length <= 40 && p.b.length <= 40)
    .map((p) => ({ a: flat(p.a, 40), b: flat(p.b, 40) }));
  const sa = new Set(pr.map((p) => gnorm(p.a))), sb2 = new Set(pr.map((p) => gnorm(p.b)));
  if (pr.length < 3 || pr.length > 5 || sa.size !== pr.length || sb2.size !== pr.length) return null;
  return { title: flat(x.title, 60), pairs: pr };
}
function xgValidSlider(x) {
  if (!x || typeof x.q !== 'string' || !x.q.trim() || x.q.length > 220) return null;
  const mn = Number(x.min), mx = Number(x.max), st = Number(x.step || 1), tg = Number(x.target), tl = Number(x.tol || 0);
  if (![mn, mx, st, tg, tl].every((v) => Number.isInteger(v))) return null;
  if (!(mn < mx) || mx - mn > 100000 || st <= 0 || st > mx - mn) return null;
  if (tg < mn || tg > mx || (tg - mn) % st !== 0) return null;
  if (tl < 0 || tl > Math.max(1, (mx - mn) / 10)) return null;
  return { q: flat(x.q, 220), min: mn, max: mx, step: st, target: tg, tol: tl, unit: typeof x.unit === 'string' ? flat(x.unit, 20) : '' };
}
async function genXgMatch(day, theme) {
  const txt = await claudeText(
    'তুমি স্কুলের শিক্ষার্থীদের জন্য জোড়া মেলানোর খেলার প্রশ্নপ্রণেতা। শুধু JSON দাও, কোনো ব্যাখ্যা নয়: {"items":[{"title":"শিরোনাম","pairs":[{"a":"বাম","b":"ডান"}]}]}। প্রতি সেটে ৩–৪টি জোড়া; প্রতিটি জোড়া নিশ্চিতভাবে সঠিক; ডান পাশের প্রতিটি লেখা আলাদা; প্রতিটি লেখা ৪০ অক্ষরের মধ্যে।',

}
async function genXgSlider(day, theme) {
  const txt = await claudeText(
    'তুমি স্কুলের শিক্ষার্থীদের জন্য স্লাইডার প্রশ্নপ্রণেতা। শুধু JSON দাও: {"items":[{"q":"প্রশ্ন","min":0,"max":100,"step":1,"target":60,"tol":2,"unit":"একক"}]}। min, max, step, target, tol সব পূর্ণসংখ্যা; target অবশ্যই min থেকে শুরু করে step-এর গুণিতক ধাপে থাকবে; সঠিক উত্তর নিশ্চিতভাবে সঠিক হতে হবে।',
    `তারিখ ${day}। বিষয়-ভাবনা: ${theme}। ৩টি নতুন প্রশ্ন দাও (গণনা, বিজ্ঞানের মান, ভূগোলের সংখ্যা ইত্যাদি)।`, 1200);

}
async function jobXgExt(dry) {
  const day = today();
  const theme = XG_THEMES[new Date(day + 'T00:00:00Z').getUTCDay() % XG_THEMES.length];
  const [mt, sl] = await Promise.all([genXgMatch(day, theme).catch(() => []), genXgSlider(day, theme).catch(() => [])]);
  const out = { ok: true, day, theme, match: mt.length, slider: sl.length };
  if (dry) return { ...out, dry: true };
  if (!mt.length && !sl.length) throw new Error('এআই থেকে কোনো বৈধ নতুন গেম পাওয়া যায়নি');
  // ১৪ দিনের পুরনো কন্টেন্ট বন্ধ করা — নতুনগুলো চালু থাকবে, তাই গেম প্রতিদিন নতুন দেখায়
  const cut = new Date(Date.now() - 14 * 86400000).toISOString();

    ...mt.map((p) => ({ game: 'match', payload: p, source: 'ai' })),
    ...sl.map((p) => ({ game: 'slider', payload: p, source: 'ai' })),
  ];
  await sb('/rest/v1/xg_ext', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(rows) });
  return out;
}
