.pbwrap{margin-top:14px}.pbwrap h3{font-size:1rem;margin:0 0 8px}.pbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}.pbt{aspect-ratio:1/1;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,color-mix(in srgb,var(--a1) 12%,var(--card)),var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;gap:6px;box-shadow:0 3px 10px rgba(90,70,200,.12)}.pbt b{font-size:2.5rem;line-height:1}.pbt span{font-size:.78rem;font-weight:700;line-height:1.25;word-break:break-word}.pbt.r{border-color:color-mix(in srgb,var(--a3) 55%,transparent);background:linear-gradient(145deg,color-mix(in srgb,var(--a3) 18%,var(--card)),var(--card))}

.mbx{background:radial-gradient(circle at 50% 35%,rgba(109,90,230,.88),rgba(15,10,40,.95));z-index:120}
.mbc{text-align:center;color:#fff;max-width:340px;width:100%}
.mbt{font-size:1.3rem;font-weight:700;margin-bottom:8px}
.mbg{font-size:7rem;line-height:1.2;cursor:pointer;animation:mbfloat 2s ease-in-out infinite;filter:drop-shadow(0 0 26px #fbbf24)}
.mbg.shake{animation:mbshake .65s}.mbg.pop{animation:mbpop .55s}
.mbh{opacity:.85;animation:mbblink 1.4s infinite}

@keyframes mbshake{10%,50%,90%{transform:rotate(-14deg) scale(1.1)}30%,70%{transform:rotate(14deg) scale(1.1)}100%{transform:scale(1.3)}}
@keyframes mbpop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}

@keyframes mbblink{50%{opacity:.35}}

.fzc{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:var(--card)}

.fzgift{background:linear-gradient(135deg,var(--a3),var(--a2))}

</style>

<script type="text/plain" id="subsql">
-- bKash সাবস্ক্রিপশন সেটআপ (একবার Run করুন)
alter table public.contents add column if not exists is_free boolean not null default false;

create table if not exists public.subscriptions(
  user_id uuid primary key references auth.users(id) on delete cascade,
  status text not null default 'pending' check (status in ('pending','active','rejected')),
  trx_id text unique,
  sender text,
  created_at timestamptz not null default now(),
  approved_at timestamptz
);
alter table public.subscriptions enable row level security;

create or replace function public.sub_is_admin() returns boolean language sql security definer set search_path=public stable as $f$
  select exists(select 1 from public.admins where user_id=auth.uid()) $f$;
create or replace function public.sub_is_active() returns boolean language sql security definer set search_path=public stable as $f$
  select exists(select 1 from public.subscriptions where user_id=auth.uid() and status='active') $f$;

create or replace function public.my_subscription() returns text language sql security definer set search_path=public stable as $f$
  select case when public.sub_is_admin() then 'admin'
    else coalesce((select status from public.subscriptions where user_id=auth.uid()),'none') end $f$;

create or replace function public.request_subscription(p_trx text,p_sender text) returns text
language plpgsql security definer set search_path=public as $f$
begin
  if auth.uid() is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then
    raise exception 'সাবস্ক্রাইব করতে অ্যাকাউন্টে লগইন করুন';
  end if;
  if p_trx is null or upper(trim(p_trx)) !~ '^[A-Z0-9]{8,12}$' then
    raise exception 'TrxID সঠিক নয়';
  end if;
  if p_sender is null or trim(p_sender) !~ '^01[0-9]{9}$' then
    raise exception 'bKash নম্বর সঠিক নয়';
  end if;
  if public.sub_is_active() then return 'active'; end if;
  insert into public.subscriptions(user_id,status,trx_id,sender)
    values(auth.uid(),'pending',upper(trim(p_trx)),trim(p_sender))
  on conflict(user_id) do update
    set status='pending',trx_id=upper(trim(p_trx)),sender=trim(p_sender),created_at=now();
  return 'pending';
exception when unique_violation then
  raise exception 'এই TrxID আগেই ব্যবহার হয়েছে';
end $f$;

create or replace function public.content_catalog() returns jsonb language sql security definer set search_path=public stable as $f$
  select coalesce(jsonb_agg(
    (to_jsonb(c) - 'url' - 'body')
    || jsonb_build_object('url',case when t.ok then c.url end,'body',case when t.ok then c.body end,'locked',not t.ok)
    order by c.id),'[]'::jsonb)
  from public.contents c
  cross join lateral (select (c.is_free or public.sub_is_admin() or public.sub_is_active()) as ok) t $f$;

create or replace function public.admin_subscriptions() returns jsonb language sql security definer set search_path=public stable as $f$
  select coalesce(jsonb_agg(jsonb_build_object('user_id',s.user_id,'email',u.email,
    'name',u.raw_user_meta_data->>'full_name','sender',s.sender,'trx_id',s.trx_id,
    'status',s.status,'created_at',s.created_at)
    order by (s.status='pending') desc,s.created_at desc),'[]'::jsonb)
  from public.subscriptions s join auth.users u on u.id=s.user_id
  where public.sub_is_admin() $f$;

create or replace function public.admin_set_subscription(p_user uuid,p_status text) returns void
language plpgsql security definer set search_path=public as $f$
begin
  if not public.sub_is_admin() then raise exception 'অনুমতি নেই'; end if;
  if p_status not in ('pending','active','rejected') then raise exception 'ভুল অবস্থা'; end if;
  update public.subscriptions set status=p_status,
    approved_at=case when p_status='active' then now() else null end where user_id=p_user;
end $f$;

create or replace function public.admin_grant_by_email(p_email text) returns void
language plpgsql security definer set search_path=public as $f$
declare uid uuid;
begin
  if not public.sub_is_admin() then raise exception 'অনুমতি নেই'; end if;
  select id into uid from auth.users where lower(email)=lower(trim(p_email));
  if uid is null then raise exception 'এই ইমেইলে কোনো অ্যাকাউন্ট নেই'; end if;
  insert into public.subscriptions(user_id,status,approved_at) values(uid,'active',now())
  on conflict(user_id) do update set status='active',approved_at=now();
end $f$;

-- কনটেন্ট টেবিল থেকে সরাসরি পড়া শুধু ফ্রি / সাবস্ক্রাইবার / অ্যাডমিনের জন্য
do $f$ declare r record; begin
  for r in select policyname from pg_policies where schemaname='public' and tablename='contents' and cmd='SELECT'
  loop execute format('drop policy %I on public.contents',r.policyname); end loop;
end $f$;
create policy contents_gated_select on public.contents for select to authenticated
  using (is_free or public.sub_is_admin() or public.sub_is_active());

-- ভিজিটররা লগইন ছাড়াই পরীক্ষার তালিকা দেখতে পাবে
drop policy if exists exams_public_read on public.exams;
create policy exams_public_read on public.exams for select to anon using (true);

-- শিক্ষক/অভিভাবক রিপোর্টের জন্য স্টুডেন্ট তালিকা (শুধু অ্যাডমিন)
create or replace function public.admin_students() returns jsonb language sql security definer set search_path=public stable as $f$
  select coalesce(jsonb_agg(jsonb_build_object('user_id',u.id,'email',u.email,
    'name',u.raw_user_meta_data->>'full_name','class_level',u.raw_user_meta_data->>'class_level',
    'guardian',u.raw_user_meta_data->>'guardian','whatsapp',u.raw_user_meta_data->>'whatsapp',
    'mobile',u.raw_user_meta_data->>'mobile') order by u.created_at desc),'[]'::jsonb)
  from auth.users u where public.sub_is_admin() and not coalesce(u.is_anonymous,false) $f$;
</script>
<script type="text/plain" id="tch-sql">
-- 👨‍🏫 টিচারস প্যানেল সেটআপ (একবার Run করুন; বারবার চালালেও সমস্যা নেই)

-- ১) শিক্ষকের আবেদন/অনুমোদন
create table if not exists public.teachers(
  user_id uuid primary key references auth.users(id) on delete cascade,
  name text, phone text, note text,
  status text not null default 'pending' check (status in ('pending','active','rejected')),
  created_at timestamptz not null default now(),
  approved_at timestamptz
);
alter table public.teachers enable row level security;

create or replace function public.t_is_admin() returns boolean language sql security definer set search_path=public stable as $f$
  select exists(select 1 from public.admins where user_id=auth.uid()) $f$;
create or replace function public.t_is_teacher() returns boolean language sql security definer set search_path=public stable as $f$
  select exists(select 1 from public.teachers where user_id=auth.uid() and status='active') $f$;

create or replace function public.my_teacher_status() returns text language sql security definer set search_path=public stable as $f$
  select coalesce((select status from public.teachers where user_id=auth.uid()),'none') $f$;

create or replace function public.request_teacher(p_name text,p_phone text,p_note text) returns text
language plpgsql security definer set search_path=public as $f$
begin
  if auth.uid() is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then
    raise exception 'আগে অ্যাকাউন্টে লগইন করুন';
  end if;
  if coalesce(trim(p_name),'')='' then raise exception 'আপনার নাম দিন'; end if;
  if public.t_is_teacher() then return 'active'; end if;
  insert into public.teachers(user_id,name,phone,note,status)
    values(auth.uid(),trim(p_name),trim(p_phone),trim(p_note),'pending')
  on conflict(user_id) do update
    set name=trim(p_name),phone=trim(p_phone),note=trim(p_note),status='pending',created_at=now(),approved_at=null;
  return 'pending';
end $f$;

create or replace function public.admin_teachers() returns jsonb language sql security definer set search_path=public stable as $f$
  select coalesce(jsonb_agg(jsonb_build_object('user_id',t.user_id,'email',u.email,
    'name',coalesce(t.name,u.raw_user_meta_data->>'full_name'),'phone',t.phone,'note',t.note,
    'status',t.status,'created_at',t.created_at,
    'exams',(select count(*) from public.exams e where e.owner_id=t.user_id))
    order by (t.status='pending') desc,t.created_at desc),'[]'::jsonb)
  from public.teachers t join auth.users u on u.id=t.user_id
  where public.t_is_admin() $f$;

create or replace function public.admin_set_teacher(p_user uuid,p_status text) returns void
language plpgsql security definer set search_path=public as $f$
begin
  if not public.t_is_admin() then raise exception 'অনুমতি নেই'; end if;
  if p_status not in ('pending','active','rejected') then raise exception 'ভুল অবস্থা'; end if;
  update public.teachers set status=p_status,
    approved_at=case when p_status='active' then now() else null end where user_id=p_user;
end $f$;

create or replace function public.admin_grant_teacher(p_email text) returns void
language plpgsql security definer set search_path=public as $f$
declare uid uuid;
begin
  if not public.t_is_admin() then raise exception 'অনুমতি নেই'; end if;
  select id into uid from auth.users where lower(email)=lower(trim(p_email));
  if uid is null then raise exception 'এই ইমেইলে কোনো অ্যাকাউন্ট নেই'; end if;
  insert into public.teachers(user_id,name,status,approved_at)
    values(uid,(select raw_user_meta_data->>'full_name' from auth.users where id=uid),'active',now())
  on conflict(user_id) do update set status='active',approved_at=now();
end $f$;

-- ২) পরীক্ষার মালিক (শিক্ষক)। অ্যাডমিনের পরীক্ষায় owner_id ফাঁকা থাকে।
alter table public.exams add column if not exists owner_id uuid references auth.users(id) on delete cascade;
create index if not exists exams_owner_idx on public.exams(owner_id);

-- ৩) শিক্ষক শুধু নিজের পরীক্ষা/প্রশ্ন/উত্তর/ফলাফল ম্যানেজ করবে
drop policy if exists t_exams_sel on public.exams;
create policy t_exams_sel on public.exams for select to authenticated using (owner_id=auth.uid());
drop policy if exists t_exams_ins on public.exams;
create policy t_exams_ins on public.exams for insert to authenticated with check (owner_id=auth.uid() and public.t_is_teacher());
drop policy if exists t_exams_upd on public.exams;
create policy t_exams_upd on public.exams for update to authenticated using (owner_id=auth.uid() and public.t_is_teacher()) with check (owner_id=auth.uid());
drop policy if exists t_exams_del on public.exams;
create policy t_exams_del on public.exams for delete to authenticated using (owner_id=auth.uid() and public.t_is_teacher());

drop policy if exists t_questions_all on public.questions;
create policy t_questions_all on public.questions for all to authenticated
  using (public.t_is_teacher() and exists(select 1 from public.exams e where e.id=questions.exam_id and e.owner_id=auth.uid()))
  with check (public.t_is_teacher() and exists(select 1 from public.exams e where e.id=questions.exam_id and e.owner_id=auth.uid()));

drop policy if exists t_keys_all on public.answer_keys;
create policy t_keys_all on public.answer_keys for all to authenticated
  using (public.t_is_teacher() and exists(select 1 from public.questions q join public.exams e on e.id=q.exam_id where q.id=answer_keys.question_id and e.owner_id=auth.uid()))
  with check (public.t_is_teacher() and exists(select 1 from public.questions q join public.exams e on e.id=q.exam_id where q.id=answer_keys.question_id and e.owner_id=auth.uid()));

drop policy if exists t_results_sel on public.results;
create policy t_results_sel on public.results for select to authenticated
  using (public.t_is_teacher() and exists(select 1 from public.exams e where e.id=results.exam_id and e.owner_id=auth.uid()));
drop policy if exists t_results_upd on public.results;
create policy t_results_upd on public.results for update to authenticated
  using (public.t_is_teacher() and exists(select 1 from public.exams e where e.id=results.exam_id and e.owner_id=auth.uid()))
  with check (public.t_is_teacher() and exists(select 1 from public.exams e where e.id=results.exam_id and e.owner_id=auth.uid()));
drop policy if exists t_results_del on public.results;
create policy t_results_del on public.results for delete to authenticated
  using (public.t_is_teacher() and exists(select 1 from public.exams e where e.id=results.exam_id and e.owner_id=auth.uid()));

-- ৪) শিক্ষকের নিজস্ব প্রশ্নব্যাংক (অন্য কেউ দেখতে পাবে না)
create table if not exists public.teacher_bank(

create or replace function public.teacher_review(p_result_id text) returns jsonb
language plpgsql security definer set search_path=public as $f$
declare r record; ex record; items jsonb;
begin
  if not public.t_is_teacher() then raise exception 'শুধু অনুমোদিত শিক্ষক'; end if;
  select * into r from public.results where id::text=p_result_id;
  if not found then raise exception 'ফলাফল পাওয়া যায়নি'; end if;
  select * into ex from public.exams where id=r.exam_id and owner_id=auth.uid();
  if not found then raise exception 'এটি আপনার পরীক্ষা নয়'; end if;
  select coalesce(jsonb_agg(jsonb_build_object(
      'body',q.body,'options',to_jsonb(q.options),'correct',k.correct,
      'chosen',case when r.answers is null then null else nullif(r.answers->>(q.id::text),'')::int end,
      'marks',coalesce(q.marks,1)) order by q.id),'[]'::jsonb)
    into items
    from public.questions q left join public.answer_keys k on k.question_id=q.id
    where q.exam_id=r.exam_id;
  return jsonb_build_object('exam',ex.title,'student',r.student_name,'at',r.created_at,
    'score',r.score,'total',r.total,
    'recorded',coalesce(r.answers,'{}'::jsonb)<>'{}'::jsonb,'items',items);
end $f$;

create or replace function public.teacher_attempts() returns jsonb
language plpgsql security definer set search_path=public stable as $f$
begin
  if not public.t_is_teacher() then raise exception 'শুধু অনুমোদিত শিক্ষক'; end if;
  return coalesce((select jsonb_agg(jsonb_build_object(
      'user_id',a.user_id,'exam_id',a.exam_id,'exam_title',e.title,
      'name',coalesce(u.raw_user_meta_data->>'full_name',u.email,'অতিথি'),
      'submitted',exists(select 1 from public.results r where r.user_id=a.user_id and r.exam_id=a.exam_id))
      order by e.id desc)
    from public.attempts a
    join public.exams e on e.id=a.exam_id and e.owner_id=auth.uid()
    left join auth.users u on u.id=a.user_id),'[]'::jsonb);
end $f$;

create or replace function public.teacher_reset(p_user uuid,p_exam text) returns text
language plpgsql security definer set search_path=public as $f$
begin
  if not public.t_is_teacher() then raise exception 'শুধু অনুমোদিত শিক্ষক'; end if;
  if not exists(select 1 from public.exams where id::text=p_exam and owner_id=auth.uid()) then
    raise exception 'এটি আপনার পরীক্ষা নয়';
  end if;
  delete from public.results where user_id=p_user and exam_id::text=p_exam;
  delete from public.attempts where user_id=p_user and exam_id::text=p_exam;
  return 'ok';
end $f$;

  xgv16css();

  var R=d.items,sid=d.session,i=0,ans=[];
  function round(){
    var rd=R[i],n=rd.left.length,pair=[],sel=-1,L=[],Rr=[],k;
    for(k=0;k<n;k++)pair.push(-1);
    box.innerHTML="";
    box.appendChild(el("div","রাউন্ড "+bn(i+1)+" / "+bn(R.length),"chip"));
    box.appendChild(el("p",rd.q,"gq"));
    box.appendChild(el("small","বাম পাশের একটি লেখা টেনে ডান পাশের জোড়ায় ছাড়ুন — অথবা আগে বাম ট্যাপ করে তারপর ডান ট্যাপ করুন।"));
    var cols=el("div");cols.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px";
    var colL=el("div"),colR=el("div");cols.appendChild(colL);cols.appendChild(colR);box.appendChild(cols);
    var ok=el("button","✔ জমা দিন");ok.disabled=true;
    function assign(l,r){
      for(var x=0;x<n;x++){if(pair[x]===r)pair[x]=-1}
      pair[l]=r;
    }
    function paint(){
      L.forEach(function(e,l){
        e.textContent=rd.left[l]+(pair[l]>=0?"  ↔  "+rd.right[pair[l]]:"");
        e.classList.toggle("on",pair[l]>=0);e.classList.toggle("sel",sel===l);
      });
      Rr.forEach(function(e,r){e.classList.toggle("on",pair.indexOf(r)>=0)});
      ok.disabled=pair.some(function(v){return v<0});
    }
    function drag(e,l){
      e.addEventListener("pointerdown",function(ev){
        if(ev.button>0)return;
        var sx=ev.clientX,sy=ev.clientY,moved=false,g=null;
        try{e.setPointerCapture(ev.pointerId)}catch(_){}
        function mv(m){
          if(!moved&&Math.hypot(m.clientX-sx,m.clientY-sy)>8){moved=true;g=el("div",rd.left[l],"gh");document.body.appendChild(g)}
          if(g){g.style.left=(m.clientX+10)+"px";g.style.top=(m.clientY+10)+"px"}
        }
        function up(m){
          e.removeEventListener("pointermove",mv);e.removeEventListener("pointerup",up);e.removeEventListener("pointercancel",up);
          if(g){g.remove();g=null}
          if(moved){
            var t=document.elementFromPoint(m.clientX,m.clientY),rt=t&&t.closest?t.closest("[data-r]"):null;
            if(rt){assign(l,+rt.getAttribute("data-r"));sel=-1}
          }else{sel=(sel===l)?-1:l}
          paint();
        }
        e.addEventListener("pointermove",mv);e.addEventListener("pointerup",up);e.addEventListener("pointercancel",up);
      });
    }
    rd.left.forEach(function(txt,l){var e=el("div",txt,"mch");drag(e,l);L.push(e);colL.appendChild(e)});
    rd.right.forEach(function(txt,r){
      var e=el("div",txt,"mch mchR");e.setAttribute("data-r",String(r));
      e.onclick=function(){
        if(sel>=0){assign(sel,r);sel=-1}
        else{var x=pair.indexOf(r);if(x>=0)pair[x]=-1}
        paint();
      };
      Rr.push(e);colR.appendChild(e);
    });
    ok.onclick=function(){ans.push(pair.slice());i++;if(i>=R.length)xgFinish(box,c,sid,ans,again,menu,null);else round()};
    box.appendChild(ok);paint();
  }
  round();
}

  var nm=(user.user_metadata&&user.user_metadata.full_name)||"";
  var bd=((window.PB&&PB.std)||[]).map(function(x){return {e:x.e,t:x.t}});
  return db.rpc("friend_sync",{p_name:nm,p_avatar:av(),p_badges:bd,p_xp:Math.round(window.__fzXp||0),p_level:Math.max(1,Math.round(window.__fzLv||1))}).then(function(r){return r},function(){});
}
function fzPct(s,m){return m>0?Math.round(s/m*100):0}

$("doPaste").onclick=function(){
  var m=$("msg"),bad=[],ok=0,ex=$("qs").children;
  for(var j=ex.length-1;j>=0;j--){
    var b0=ex[j];
    if(!b0.querySelector(".qbody").value.trim()&&[].every.call(b0.querySelectorAll(".aopt"),function(o){return !o.value.trim()}))b0.remove();
  }
  $("paste").value.split(/\n\s*\n/).forEach(function(bl,n){
    var ls=bl.split("\n").map(function(x){return x.trim()}).filter(Boolean);
    if(!ls.length)return;
    var body=[],opts=[],ans=-1,marks=1;
    ls.forEach(function(l){
      var r;
      if(r=l.match(/^(?:উত্তর|ans(?:wer)?)\s*[:：\-]\s*(.+)$/i))ans=li(r[1]);
      else if(r=l.match(/^(?:নম্বর|marks?)\s*[:：\-]\s*(\S+)/i))marks=parseInt(bd(r[1]))||1;
      else if(body.length&&(r=l.match(/^\(?\s*([কখগঘA-Da-d1-4১-৪])\s*[\)\.।:\-]\s*(.+)$/)))opts[li(r[1])]=r[2];
      else if(!opts.length)body.push(l);
    });
    var q=body.join(" ").replace(/^\s*[\d০-৯]+\s*[\.\)।]\s*/,"").trim();
    if(!q||ans<0||![0,1,2,3].every(function(i){return opts[i]})){bad.push(bn(n+1));return}

  });

};

async function loadHard(){

  var key={};ks.data.forEach(function(k){key[k.question_id]=k.correct});

  rs.data.forEach(function(r){
    if(!r.answers||!Object.keys(r.answers).length)return;
    qq.data.forEach(function(q){
      if(q.exam_id!==r.exam_id)return;
      var s=st[q.id]||(st[q.id]={q:q,n:0,bad:0});

  });
  var list=Object.keys(st).map(function(k){return st[k]}).filter(function(s){return s.bad>0})
    .sort(function(a,b){return b.bad/b.n-a.bad/a.n||b.n-a.n}).slice(0,5);
  if(!list.length){box.textContent="এখনও যথেষ্ট তথ্য নেই (শুধু নতুন জমা পড়া উত্তর গণনা হয়)।";return}

    row.appendChild(el("span",s.q.body+" ("+bn(s.bad)+"/"+bn(s.n)+" জন ভুল বা স্কিপ)"));
    box.appendChild(row);
  });
}

  d.appendChild(el("b","প্রশ্ন "+bn(n)));
  var q=el("input");q.placeholder="প্রশ্ন লিখুন";q.className="qbody";d.appendChild(q);
  LET.forEach(function(l){var o=el("input");o.placeholder="অপশন "+l;o.className="aopt";d.appendChild(o)});
  var s=el("select");s.className="corr";LET.forEach(function(l,i){var o=el("option","সঠিক উত্তর: "+l);o.value=i;s.appendChild(o)});d.appendChild(s);
  var mk=el("input");mk.type="number";mk.min=1;mk.value=pre?pre.marks:1;mk.className="marks";

  var rm=el("button","✕ সরান","ghost");rm.style.marginTop="8px";rm.onclick=function(){d.remove();renum()};d.appendChild(rm);
  if(pre){q.value=pre.body;d.querySelectorAll(".aopt").forEach(function(o,i){o.value=pre.options[i]});s.value=pre.correct}

}
function renum(){[].forEach.call($("t_qs").children,function(d,i){d.firstChild.textContent="প্রশ্ন "+bn(i+1)})}
function dropEmpty(){
  var ex=$("t_qs").children;
  for(var j=ex.length-1;j>=0;j--){var b=ex[j];if(!b.querySelector(".qbody").value.trim()&&[].every.call(b.querySelectorAll(".aopt"),function(o){return !o.value.trim()}))b.remove()}
  renum();
}
function readItems(){
  var items=[],bl=$("t_qs").children;
  for(var i=0;i<bl.length;i++){
    var b=bl[i],body=b.querySelector(".qbody").value.trim(),opts=[].map.call(b.querySelectorAll(".aopt"),function(x){return x.value.trim()});
    if(!body&&opts.every(function(o){return !o}))continue;
    if(!body||opts.some(function(o){return !o}))return {err:"প্রশ্ন "+bn(i+1)+": প্রশ্ন ও চারটি অপশনই লিখুন।"};
    items.push({body:body,options:opts,correct:parseInt(b.querySelector(".corr").value),marks:Math.max(1,parseInt(b.querySelector(".marks").value)||1)});
  }
  return {list:items};
}
function parsePaste(txt){
  var items=[],bad=[];
  txt.split(/\n\s*\n/).forEach(function(bl,n){
    var ls=bl.split("\n").map(function(x){return x.trim()}).filter(Boolean);if(!ls.length)return;
    var body=[],opts=[],ans=-1,marks=1;
    ls.forEach(function(l){
      var r;
      if(r=l.match(/^(?:উত্তর|ans(?:wer)?)\s*[:：\-]\s*(.+)$/i))ans=li(r[1]);
      else if(r=l.match(/^(?:নম্বর|marks?)\s*[:：\-]\s*(\S+)/i))marks=parseInt(bd(r[1]))||1;
      else if(body.length&&(r=l.match(/^\(?\s*([কখগঘA-Da-d1-4১-৪])\s*[\)\.।:\-]\s*(.+)$/)))opts[li(r[1])]=r[2];
      else if(!opts.length)body.push(l);
    });
    var q=body.join(" ").replace(/^\s*[\d০-৯]+\s*[\.\)।]\s*/,"").trim();
    if(!q||ans<0||![0,1,2,3].every(function(i){return opts[i]})){bad.push(bn(n+1));return}
    items.push({body:q,options:opts.slice(0,4),correct:ans,marks:Math.max(1,marks)});
  });
  return {items:items,bad:bad};
}

};

async function bankAddItems(items,meta){
  if(!bankLoaded)await loadBankData();

  var rows=[];
  items.forEach(function(x){
    var k=x.body.trim()+"|"+x.options.join("|");if(seen[k])return;seen[k]=1;
    rows.push({owner_id:user.id,body:x.body,options:x.options,correct:x.correct,marks:x.marks||1,class_level:meta.class_level||null,subject:meta.subject||null,chapter:meta.chapter||null});

async function fetchQs(x){
  var q=await db.from("questions").select("*").eq("exam_id",x.id).order("id");
  if(q.error)throw new Error(q.error.message);
  var ids=q.data.map(function(r){return r.id}),key={};
  if(ids.length){var k=await db.from("answer_keys").select("*").in("question_id",ids);if(k.error)throw new Error(k.error.message);k.data.forEach(function(r){key[r.question_id]=r.correct})}
  return q.data.map(function(r){return {body:r.body,options:r.options,correct:key[r.id]==null?0:key[r.id],marks:r.marks||1}});
}
async function editExam(x){
  var qs;try{qs=await fetchQs(x)}catch(e){alert("লোড করা যায়নি: "+e.message);return}
  editId=x.id;negCol="neg_mark" in x;
  $("t_title").value=x.title;$("t_dur").value=x.duration_minutes;$("t_ecls").value=x.class_level==null?"":x.class_level;$("t_esub").value=x.subject||"";$("t_echap").value=x.chapter||"";
  $("t_att").value=x.max_attempts==null?1:x.max_attempts;$("t_shq").checked=x.shuffle_questions!==false;$("t_sho").checked=x.shuffle_options!==false;$("t_rvo").checked=x.review_open!==false;$("t_neg").value=String(x.neg_mark||0);
  $("t_qs").innerHTML="";qs.forEach(function(r){addQ(r)});
  $("t_formtitle").textContent="এডিট: "+x.title;$("t_msg").textContent="";goTab("new");
}
async function dupExam(x){
  if(!confirm("\""+x.title+"\" এর একটি কপি বানাবেন?"))return;
  try{
    var qs=await fetchQs(x);
    var row={title:x.title+" (কপি)",duration_minutes:x.duration_minutes,max_attempts:x.max_attempts,shuffle_questions:x.shuffle_questions,shuffle_options:x.shuffle_options,review_open:x.review_open,class_level:x.class_level,subject:x.subject,chapter:x.chapter,owner_id:user.id};
    if("neg_mark" in x)row.neg_mark=x.neg_mark;
    var e=await db.from("exams").insert(row).select().single();if(e.error)throw new Error(e.error.message);
    var q=await db.from("questions").insert(qs.map(function(r){return {exam_id:e.data.id,body:r.body,options:r.options,marks:r.marks}})).select();if(q.error)throw new Error(q.error.message);
    var k=await db.from("answer_keys").insert(q.data.map(function(r,i){return {question_id:r.id,correct:qs[i].correct}}));if(k.error)throw new Error(k.error.message);
    loadExams();
  }catch(e){alert("কপি করা যায়নি: "+e.message)}
}

  var ids=Object.keys(myIds).map(Number);if(!ids.length){box.textContent="এখনও যথেষ্ট তথ্য নেই।";return}
  var qq=await db.from("questions").select("id,exam_id,body").in("exam_id",ids),ks=await db.from("answer_keys").select("*");
  if(qq.error||ks.error){box.textContent="লোড করা যায়নি।";return}
  var key={};ks.data.forEach(function(k){key[k.question_id]=k.correct});var st={};
  resAll.forEach(function(r){
    if(!r.answers||!Object.keys(r.answers).length)return;
    qq.data.forEach(function(q){if(q.exam_id!==r.exam_id)return;var s=st[q.id]||(st[q.id]={q:q,n:0,bad:0});s.n++;if(r.answers[q.id]!==key[q.id])s.bad++});

    }else{u.score+=Number(x.score)||0;u.total+=Number(x.total)||0}

<script>
/* ছবি সাপোর্ট: প্রশ্ন/অপশনের লেখায় [[img:URL]] থাকলে ছবি হিসেবে দেখায় */
(function(){
var RE=/\[\[img:(https?:\/\/[^\]\s]+)\]\]/g,SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,OPTION:1,TITLE:1,INPUT:1};
function zoom(e){var o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out";var im=new Image();im.src=e.target.src;im.style.cssText="max-width:100%;max-height:100%;background:#fff;border-radius:8px";o.appendChild(im);o.onclick=function(){o.remove()};document.body.appendChild(o)}
function conv(t){
  var p=t.parentNode;if(!p||SKIP[p.nodeName])return;
  var s=t.nodeValue;if(s.indexOf("[[img:")<0)return;
  RE.lastIndex=0;if(!RE.test(s))return;RE.lastIndex=0;
  var f=document.createDocumentFragment(),last=0,m,inOpt=!!(p.closest&&p.closest(".opt"));
  while((m=RE.exec(s))){
    if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));
    var im=new Image();im.className="qimg"+(inOpt?"":" zm");im.crossOrigin="anonymous";im.alt="ছবি";im.src=m[1];
    if(!inOpt)im.onclick=zoom;f.appendChild(im);last=RE.lastIndex;
  }
  if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));
  p.replaceChild(f,t);
}
function scan(n){
  if(n.nodeType===3){conv(n);return}
  if(n.nodeType!==1||SKIP[n.nodeName])return;
  var w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,null),a=[],x;
  while((x=w.nextNode()))if(x.nodeValue.indexOf("[[img:")>=0)a.push(x);
  a.forEach(conv);
}
new MutationObserver(function(ms){ms.forEach(function(m){
  if(m.type==="characterData")conv(m.target);
  else m.addedNodes.forEach(scan);
})}).observe(document.body,{childList:true,subtree:true,characterData:true});
scan(document.body);

function shrink(file){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
    var M=1100,r=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("ছবি প্রসেস হয়নি"))},"image/jpeg",.85);
  };
  im.onerror=function(){rej(new Error("ছবিটি পড়া যায়নি"))};im.src=u;
})}
async function upImg(file){
  var b=await shrink(file),path="q/"+Date.now()+"_"+Math.random().toString(36).slice(2,8)+".jpg";
  var D=window.__adb||(window.__ctx&&window.__ctx().db);if(!D)throw new Error("সংযোগ পাওয়া যায়নি, পেজ রিফ্রেশ করুন");
  var r=await D.storage.from("qimg").upload(path,b,{contentType:"image/jpeg",upsert:false});
  if(r.error)throw r.error;
  return D.storage.from("qimg").getPublicUrl(path).data.publicUrl;
}
window.imgTools=function(inp){
  var w=document.createElement("div");w.className="imgtl";
  var b=document.createElement("button");b.type="button";b.className="ghost";b.textContent="🖼 ছবি যোগ করুন";
  var f=document.createElement("input");f.type="file";f.accept="image/*";f.style.display="none";
  var pv=document.createElement("span");pv.style.cssText="display:contents";
  w.appendChild(b);w.appendChild(f);w.appendChild(pv);
  function paint(){
    pv.innerHTML="";var v=inp.value,m,re=/\[\[img:(https?:\/\/[^\]\s]+)\]\]/g;
    while((m=re.exec(v))){(function(mk,url){
      var t=document.createElement("span");t.className="th";
      var im=new Image();im.src=url;im.crossOrigin="anonymous";
      var x=document.createElement("i");x.textContent="✕";x.title="ছবি সরান";
      x.onclick=function(){inp.value=inp.value.replace(mk,"").replace(/\s{2,}/g," ").trim();paint()};
      t.appendChild(im);t.appendChild(x);pv.appendChild(t);
    })(m[0],m[1])}
  }
  async function add(file){
    if(!file||!/^image\//.test(file.type))return;
    var old=b.textContent;b.disabled=true;b.textContent="আপলোড হচ্ছে...";
    try{var u=await upImg(file);inp.value=(inp.value+" [[img:"+u+"]]").trim();paint()}
    catch(e){alert("ছবি আপলোড হয়নি: "+(e&&e.message||e)+"\n\nSupabase-এ 'qimg' বাকেটের SQL চালিয়েছেন কি না দেখুন।")}
    b.disabled=false;b.textContent=old;f.value="";
  }
  b.onclick=function(){f.click()};
  f.onchange=function(){add(f.files[0])};
  inp.addEventListener("input",paint);
  inp.addEventListener("paste",function(e){var it=[].find.call((e.clipboardData&&e.clipboardData.items)||[],function(x){return /^image\//.test(x.type)});if(it){e.preventDefault();add(it.getAsFile())}});
  return w;
};
})();

<script type="text/plain" id="v2-sql">
-- ===== V2: AI টিউটর + ডাউট সলভ + কয়েন শপ + WhatsApp অটোমেশন (একবার Run করুন) =====
-- বারবার Run করলেও সমস্যা নেই। আগের কোনো টেবিল/ফাংশন বদলায় না।

create or replace function public._is_admin() returns boolean language sql security definer set search_path=public stable as $f$
  select exists(select 1 from public.admins where user_id=auth.uid()) $f$;

-- ---------- কনফিগ (এখান থেকেই ফ্রি লিমিট/দাম বদলাতে পারবেন) ----------
create table if not exists public.ai_config(key text primary key, val int not null);
insert into public.ai_config(key,val) values
  ('doubt_free',3),('doubt_cost',5),('tutor_free',20),
  ('coin_exam_base',5),('coin_exam_max_bonus',10),('coin_daily',10)
on conflict(key) do nothing;
alter table public.ai_config enable row level security;
drop policy if exists ai_config_read on public.ai_config;
create policy ai_config_read on public.ai_config for select to authenticated using(true);
create or replace function public._cfg(k text) returns int language sql stable security definer set search_path=public as $f$
  select val from public.ai_config where key=k $f$;

-- ---------- কয়েন ওয়ালেট ----------
create table if not exists public.coin_wallet(
  user_id uuid primary key references auth.users(id) on delete cascade,
  balance int not null default 0 check (balance>=0),
  doubt_credits int not null default 0 check (doubt_credits>=0),
  tutor_boost int not null default 0 check (tutor_boost>=0),
  updated_at timestamptz not null default now());
create table if not exists public.coin_log(
  id bigserial primary key,
  user_id uuid not null references auth.users(id) on delete cascade,
  delta int not null, reason text, ref text,
  created_at timestamptz not null default now());
create unique index if not exists coin_log_ref_uq on public.coin_log(user_id,ref) where ref is not null;
alter table public.coin_wallet enable row level security;
alter table public.coin_log enable row level security;
drop policy if exists coin_wallet_own on public.coin_wallet;
create policy coin_wallet_own on public.coin_wallet for select to authenticated using(user_id=auth.uid());
drop policy if exists coin_log_own on public.coin_log;
create policy coin_log_own on public.coin_log for select to authenticated using(user_id=auth.uid());

create table if not exists public.usage_log(
  id bigserial primary key,
  user_id uuid not null references auth.users(id) on delete cascade,
  kind text not null,
  day date not null default ((now() at time zone 'Asia/Dhaka')::date),
  created_at timestamptz not null default now());
create index if not exists usage_log_idx on public.usage_log(user_id,kind,day);
alter table public.usage_log enable row level security;

-- শুধু সার্ভার/ট্রিগার ব্যবহার করে (ক্লায়েন্ট সরাসরি কল করতে পারে না)
create or replace function public._coin_add(p_user uuid,p_amt int,p_reason text,p_ref text) returns boolean
language plpgsql security definer set search_path=public as $f$
begin
  if p_amt<=0 then return false; end if;
  if p_ref is not null then
    begin
      insert into public.coin_log(user_id,delta,reason,ref) values(p_user,p_amt,p_reason,p_ref);
    exception when unique_violation then return false; end;
  else
    insert into public.coin_log(user_id,delta,reason) values(p_user,p_amt,p_reason);
  end if;
  insert into public.coin_wallet(user_id,balance) values(p_user,p_amt)
  on conflict(user_id) do update set balance=public.coin_wallet.balance+p_amt, updated_at=now();
  return true;
end $f$;
revoke all on function public._coin_add(uuid,int,text,text) from public,anon,authenticated;

-- পরীক্ষা জমা দিলে কয়েন (কোনো কারণে ফেল করলেও পরীক্ষা জমা আটকাবে না)
create or replace function public.trg_coin_result() returns trigger language plpgsql security definer set search_path=public as $f$
declare uid uuid; anon boolean; pct numeric; amt int;
begin
  begin
    uid:=(to_jsonb(new)->>'user_id')::uuid;
    select coalesce(is_anonymous,false) into anon from auth.users where id=uid;
    if uid is null or anon then return new; end if;
    pct:=case when coalesce((to_jsonb(new)->>'total')::numeric,0)>0
      then greatest(0,least(1,(to_jsonb(new)->>'score')::numeric/(to_jsonb(new)->>'total')::numeric)) else 0 end;
    amt:=coalesce(public._cfg('coin_exam_base'),5)+round(pct*coalesce(public._cfg('coin_exam_max_bonus'),10));
    perform public._coin_add(uid,amt,'পরীক্ষা সম্পন্ন','res:'||(to_jsonb(new)->>'id'));
  exception when others then null;
  end;
  return new;
end $f$;
create or replace function public.trg_coin_daily() returns trigger language plpgsql security definer set search_path=public as $f$
declare uid uuid; anon boolean;
begin
  begin
    uid:=(to_jsonb(new)->>'user_id')::uuid;
    select coalesce(is_anonymous,false) into anon from auth.users where id=uid;
    if uid is null or anon then return new; end if;
    perform public._coin_add(uid,coalesce(public._cfg('coin_daily'),10),'ডেইলি চ্যালেঞ্জ','dr:'||(to_jsonb(new)->>'id'));
  exception when others then null;
  end;
  return new;
end $f$;
revoke all on function public.trg_coin_result() from public,anon,authenticated;
revoke all on function public.trg_coin_daily() from public,anon,authenticated;
do $f$ begin
  if to_regclass('public.results') is not null then
    drop trigger if exists coin_on_result on public.results;
    create trigger coin_on_result after insert on public.results for each row execute function public.trg_coin_result();
  end if;
  if to_regclass('public.daily_runs') is not null then
    drop trigger if exists coin_on_daily on public.daily_runs;
    create trigger coin_on_daily after insert on public.daily_runs for each row execute function public.trg_coin_daily();
  end if;
end $f$;

-- ---------- শপ ----------
create table if not exists public.shop_items(
  id text primary key, title text not null, descr text,
  cost int not null check (cost>0),
  kind text not null check (kind in ('doubt','tutor')),
  qty int not null default 1, active boolean not null default true, sort int not null default 0);
insert into public.shop_items(id,title,descr,cost,kind,qty,sort) values
  ('doubt5','❓ ডাউট প্যাক ×৫','৫টি অতিরিক্ত AI ডাউট সলভ',40,'doubt',5,1),
  ('doubt15','❓ ডাউট প্যাক ×১৫','১৫টি অতিরিক্ত AI ডাউট সলভ (সাশ্রয়ী)',100,'doubt',15,2),
  ('tutor30','🤖 টিউটর বুস্ট +৩০','AI টিউটরে ৩০টি অতিরিক্ত মেসেজ',30,'tutor',30,3)
on conflict(id) do nothing;
alter table public.shop_items enable row level security;
drop policy if exists shop_items_read on public.shop_items;
create policy shop_items_read on public.shop_items for select to authenticated using(true);

create or replace function public.shop_buy(p_item text) returns text
language plpgsql security definer set search_path=public as $f$
declare it public.shop_items%rowtype; w public.coin_wallet%rowtype; uid uuid:=auth.uid();
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'কিনতে লগইন করুন'; end if;
  select * into it from public.shop_items where id=p_item and active;
  if not found then raise exception 'আইটেমটি পাওয়া যায়নি'; end if;
  insert into public.coin_wallet(user_id) values(uid) on conflict do nothing;
  select * into w from public.coin_wallet where user_id=uid for update;
  if w.balance<it.cost then raise exception 'পর্যাপ্ত কয়েন নেই (লাগবে %, আছে %)',it.cost,w.balance; end if;
  update public.coin_wallet set balance=balance-it.cost,
    doubt_credits=doubt_credits+case when it.kind='doubt' then it.qty else 0 end,
    tutor_boost=tutor_boost+case when it.kind='tutor' then it.qty else 0 end,
    updated_at=now() where user_id=uid;
  insert into public.coin_log(user_id,delta,reason) values(uid,-it.cost,'শপ: '||it.title);
  return 'ok';
end $f$;

create or replace function public.my_ai_status() returns jsonb
language plpgsql security definer set search_path=public stable as $f$
declare uid uuid:=auth.uid(); w public.coin_wallet%rowtype; d int; t int;
begin
  if uid is null then return '{}'::jsonb; end if;
  select * into w from public.coin_wallet where user_id=uid;
  select count(*) into d from public.usage_log where user_id=uid and kind='doubt' and day=(now() at time zone 'Asia/Dhaka')::date;
  select count(*) into t from public.usage_log where user_id=uid and kind='tutor' and day=(now() at time zone 'Asia/Dhaka')::date;
  return jsonb_build_object('coins',coalesce(w.balance,0),'doubt_credits',coalesce(w.doubt_credits,0),
    'tutor_boost',coalesce(w.tutor_boost,0),
    'doubt_free_left',greatest(0,coalesce(public._cfg('doubt_free'),0)-d),
    'tutor_free_left',greatest(0,coalesce(public._cfg('tutor_free'),0)-t),
    'doubt_cost',coalesce(public._cfg('doubt_cost'),0));
end $f$;

-- AI ব্যবহারের হিসাব (শুধু সার্ভার)
create or replace function public.ai_charge(p_user uuid,p_kind text) returns text
language plpgsql security definer set search_path=public as $f$
declare w public.coin_wallet%rowtype; free int; used int; cost int;
begin
  if p_kind not in ('doubt','tutor') then raise exception 'bad kind'; end if;
  insert into public.coin_wallet(user_id) values(p_user) on conflict do nothing;
  select * into w from public.coin_wallet where user_id=p_user for update;
  free:=coalesce(public._cfg(p_kind||'_free'),0);
  select count(*) into used from public.usage_log where user_id=p_user and kind=p_kind and day=(now() at time zone 'Asia/Dhaka')::date;
  if used<free then insert into public.usage_log(user_id,kind) values(p_user,p_kind); return 'free'; end if;
  if p_kind='doubt' and w.doubt_credits>0 then
    update public.coin_wallet set doubt_credits=doubt_credits-1,updated_at=now() where user_id=p_user;
    insert into public.usage_log(user_id,kind) values(p_user,p_kind); return 'credit'; end if;
  if p_kind='tutor' and w.tutor_boost>0 then
    update public.coin_wallet set tutor_boost=tutor_boost-1,updated_at=now() where user_id=p_user;
    insert into public.usage_log(user_id,kind) values(p_user,p_kind); return 'credit'; end if;
  cost:=coalesce(public._cfg(p_kind||'_cost'),0);
  if cost>0 and w.balance>=cost then
    update public.coin_wallet set balance=balance-cost,updated_at=now() where user_id=p_user;
    insert into public.coin_log(user_id,delta,reason) values(p_user,-cost,'AI '||p_kind);
    insert into public.usage_log(user_id,kind) values(p_user,p_kind); return 'coin'; end if;
  return 'none';
end $f$;
create or replace function public.ai_refund(p_user uuid,p_kind text,p_how text) returns void
language plpgsql security definer set search_path=public as $f$
declare cost int;
begin
  delete from public.usage_log where id=(select id from public.usage_log where user_id=p_user and kind=p_kind order by id desc limit 1);
  if p_how='credit' then
    update public.coin_wallet set doubt_credits=doubt_credits+case when p_kind='doubt' then 1 else 0 end,
      tutor_boost=tutor_boost+case when p_kind='tutor' then 1 else 0 end where user_id=p_user;
  elsif p_how='coin' then
    cost:=coalesce(public._cfg(p_kind||'_cost'),0);
    update public.coin_wallet set balance=balance+cost where user_id=p_user;
    insert into public.coin_log(user_id,delta,reason) values(p_user,cost,'ফেরত (AI ত্রুটি)');
  end if;
end $f$;
revoke all on function public.ai_charge(uuid,text) from public,anon,authenticated;
revoke all on function public.ai_refund(uuid,text,text) from public,anon,authenticated;
grant execute on function public.ai_charge(uuid,text) to service_role;
grant execute on function public.ai_refund(uuid,text,text) to service_role;

create or replace function public.wa_save(p_wa text,p_guardian text,p_class int,p_result boolean,p_daily boolean,p_weekly boolean) returns void
language plpgsql security definer set search_path=public as $f$
declare uid uuid:=auth.uid();
begin
  if uid is null or coalesce((auth.jwt()->>'is_anonymous')::boolean,false) then raise exception 'লগইন করুন'; end if;
  if p_wa is not null and p_wa !~ '^8801[0-9]{9}$' then raise exception 'WhatsApp নম্বর সঠিক নয়'; end if;
  if p_guardian is not null and p_guardian !~ '^8801[0-9]{9}$' then raise exception 'অভিভাবকের নম্বর সঠিক নয়'; end if;
  if (p_result or p_daily) and p_wa is null then raise exception 'নিজের WhatsApp নম্বর দিন'; end if;
  if p_weekly and p_guardian is null then raise exception 'অভিভাবকের WhatsApp নম্বর দিন'; end if;
  if p_daily and p_class is null then raise exception 'শ্রেণি বেছে নিন'; end if;
  insert into public.wa_prefs(user_id,wa_number,guardian_number,class_level,result_on,daily_on,weekly_on,consent_at)
  values(uid,p_wa,p_guardian,p_class,coalesce(p_result,false),coalesce(p_daily,false),coalesce(p_weekly,false),now())
  on conflict(user_id) do update set wa_number=excluded.wa_number,guardian_number=excluded.guardian_number,
    class_level=excluded.class_level,result_on=excluded.result_on,daily_on=excluded.daily_on,weekly_on=excluded.weekly_on,
    consent_at=coalesce(public.wa_prefs.consent_at,now()),updated_at=now();
end $f$;

create or replace function public.admin_grant_coins(p_email text,p_amt int) returns text
language plpgsql security definer set search_path=public as $f$
declare uid uuid;
begin
  if not public._is_admin() then raise exception 'অনুমতি নেই'; end if;
  if p_amt is null or p_amt<=0 or p_amt>100000 then raise exception 'সংখ্যা ১–১,০০,০০০ হতে হবে'; end if;
  select id into uid from auth.users where lower(email)=lower(trim(p_email));
  if uid is null then raise exception 'এই ইমেইলে কোনো অ্যাকাউন্ট নেই'; end if;
  perform public._coin_add(uid,p_amt,'অ্যাডমিন বোনাস',null);
  return 'ok';
end $f$;

<script type="text/plain" id="v2-ai">
// api/ai.js — Vercel Serverless Function (Node) — Google Gemini সংস্করণ (ফ্রি টিয়ারে চলে)
// অ্যাকশন: scanq (অ্যাডমিন, ছবি থেকে প্রশ্ন স্ক্যান) · genq (অ্যাডমিন) · tutor (AI মশাই) · doubt · explain (ভুল উত্তরের ব্যাখ্যা) · aiq_get/aiq_submit (AI ডেইলি কুইজ)
// Env: SUPABASE_URL, SUPABASE_SERVICE_KEY, GEMINI_API_KEY
// ঐচ্ছিক: AI_MODEL_FAST, AI_MODEL_SMART, AI_MODEL_FALLBACK (কমা দিয়ে আলাদা; মূল মডেল ব্যস্ত থাকলে এগুলো চেষ্টা হবে)
const SB = process.env.SUPABASE_URL;
const SK = process.env.SUPABASE_SERVICE_KEY;
const GK = process.env.GEMINI_API_KEY;
const FAST = process.env.AI_MODEL_FAST || 'gemini-3.5-flash-lite';
const SMART = process.env.AI_MODEL_SMART || 'gemini-3.8-flash';
const FALLBACKS = (process.env.AI_MODEL_FALLBACK || 'gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3.8-flash').split(',').map((x) => x.trim()).filter(Boolean);

async function sb(path, opt = {}) {
  const r = await fetch(SB + path, {
    ...opt,
    headers: { apikey: SK, Authorization: 'Bearer ' + SK, 'Content-Type': 'application/json', ...(opt.headers || {}) },
  });
  const t = await r.text();
  let j = null;
  try { j = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && (j.message || j.error)) || 'DB ' + r.status);
  return j;
}
const rpc = (fn, args) => sb('/rest/v1/rpc/' + fn, { method: 'POST', body: JSON.stringify(args) });

async function authUser(req) {
  const t = (req.headers.authorization || '').replace(/^Bearer\s+/i, '');
  if (!t) return null;
  const r = await fetch(SB + '/auth/v1/user', { headers: { apikey: SK, Authorization: 'Bearer ' + t } });
  if (!r.ok) return null;
  const u = await r.json();
  return u && u.id ? u : null;
}
async function isAdmin(id) {
  const r = await sb('/rest/v1/admins?user_id=eq.' + id + '&select=user_id');
  return Array.isArray(r) && r.length > 0;
}
// অনুমোদিত শিক্ষকও প্রশ্ন বানাতে/স্ক্যান করতে পারবে
async function isStaff(id) {
  if (await isAdmin(id)) return true;
  try {
    const r = await sb('/rest/v1/teachers?user_id=eq.' + id + '&status=eq.active&select=user_id');
    return Array.isArray(r) && r.length > 0;
  } catch (e) { return false; }
}

// ---- Gemini কল (আগের claude() এর জায়গায়; ইন্টারফেস একই রাখা হয়েছে) ----
// messages: [{role:'user'|'assistant', content: string | [{type:'text',text}|{type:'image',source:{media_type,data}}]}]
function toParts(content) {
  if (typeof content === 'string') return [{ text: content }];
  return (content || []).map((c) =>
    c.type === 'image'
      ? { inlineData: { mimeType: c.source.media_type || 'image/jpeg', data: c.source.data } }
      : { text: String(c.text || '') }
  );
}
const noThink = new Set(); // যেসব মডেল thinkingConfig নেয় না
async function gcall(model, body) {
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent';
  const go = (bd) => fetch(url, { method: 'POST', headers: { 'x-goog-api-key': GK, 'content-type': 'application/json' }, body: JSON.stringify(bd) });
  let bd = body;
  if (noThink.has(model)) {
    bd = JSON.parse(JSON.stringify(body));
    delete bd.generationConfig.thinkingConfig;
  }
  let r = await go(bd);
  if (r.status === 400 && bd.generationConfig.thinkingConfig) {
    // কিছু নতুন মডেল thinkingConfig নেয় না — ওটা ছাড়া আবার চেষ্টা
    noThink.add(model);
    const b2 = JSON.parse(JSON.stringify(body));
    delete b2.generationConfig.thinkingConfig;
    b2.generationConfig.maxOutputTokens = Math.max((body.generationConfig.maxOutputTokens || 1000) * 2, 2000);
    r = await go(b2);
  }
  const j = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, j };
}
const retryable = (st, msg) => [404, 429, 500, 502, 503, 504].includes(st) || /no longer available|high demand|overloaded|unavailable|not found|try again later/i.test(msg || '');

async function claude({ model, system, messages, max_tokens = 1200, json = false, think = 0 }) {
  const body = {
    systemInstruction: { parts: [{ text: system }] },
    contents: messages.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: toParts(m.content) })),
    generationConfig: {
      maxOutputTokens: max_tokens,
      temperature: json ? 0.7 : 0.5,
      thinkingConfig: { thinkingBudget: think },
      ...(json ? { responseMimeType: 'application/json' } : {}),
    },
  };
  // মূল মডেল ব্যস্ত/অনুপস্থিত হলে নিজে থেকে পরেরটায় যাবে
  const models = [model, ...FALLBACKS].filter((m, i, a) => a.indexOf(m) === i);
  let last = null;
  for (const m of models) {
    const { ok, status, j } = await gcall(m, body);
    if (ok) {
      const c = j.candidates && j.candidates[0];
      const text = ((c && c.content && c.content.parts) || []).map((p) => p.text || '').join('');
      if (text) return text;
      const why = (j.promptFeedback && j.promptFeedback.blockReason) || (c && c.finishReason) || '';
      last = { status: 200, msg: 'AI উত্তর দেয়নি' + (why ? ' (' + why + ')' : '') + ', আবার চেষ্টা করুন' };
      if (why === 'SAFETY' || why === 'PROHIBITED_CONTENT') break;
      continue;
    }
    const msg = (j.error && j.error.message) || 'AI ত্রুটি ' + status;
    last = { status, msg };
    if (!retryable(status, msg)) break;
  }
  if (last && last.status === 429) throw new Error('এখন AI-তে অনেক চাপ (ফ্রি সীমা)। এক মিনিট পরে আবার চেষ্টা করুন।');
  throw new Error((last && last.msg) || 'AI ত্রুটি');
}

const CLS = { 1: 'প্রথম', 2: 'দ্বিতীয়', 3: 'তৃতীয়', 4: 'চতুর্থ', 5: 'পঞ্চম', 6: 'ষষ্ঠ', 7: 'সপ্তম', 8: 'অষ্টম', 9: 'নবম', 10: 'দশম', 11: 'একাদশ', 12: 'দ্বাদশ', 13: 'এডমিশন' };

const TUTOR_SYS = `তুমি "AI মশাই" — "Exam Site by Arghya"-এর স্নেহশীল, ধৈর্যশীল ও বন্ধুসুলভ AI শিক্ষক (মশাই মানে শিক্ষক)। তুমি একটি AI; কেউ জিজ্ঞেস করলে সেটা সত্যি বলবে। বাংলাদেশের NCTB পাঠ্যক্রম অনুযায়ী সহজ বাংলায় শেখাও।
- শিক্ষার্থীকে "তুমি" বলে সম্বোধন করো। আন্তরিক ও উৎসাহব্যঞ্জক থাকো; ভুল করলে বকবে না, ধরিয়ে দিয়ে বুঝিয়ে দেবে।
- আগে ধারণাটা বুঝিয়ে দাও, তারপর উদাহরণ। উত্তর ছোট ও পরিষ্কার রাখো (সাধারণত ২০০ শব্দের মধ্যে)।
- দরকারে ধাপে ধাপে দেখাও। শেষে চাইলে একটি ছোট অনুশীলন প্রশ্ন দিতে পারো।
- পড়াশোনার বাইরের বিষয় হলে বিনয়ের সঙ্গে পড়ার দিকে ফিরিয়ে আনো।
- নিশ্চিত না হলে সেটা বলো; তথ্য বানিয়ে বলো না।`;

const DOUBT_SYS = `তুমি একজন দক্ষ ডাউট সলভার। শিক্ষার্থীর সমস্যাটি ধাপে ধাপে সমাধান করো।
- প্রথমে কী চাওয়া হয়েছে এক লাইনে লেখো, তারপর ব্যবহৃত সূত্র/ধারণা, তারপর ধাপগুলো।
- শেষ লাইনে **চূড়ান্ত উত্তর** বোল্ডে দাও।
- ছবি থাকলে ছবির লেখা/চিত্র পড়ে সমাধান করো; ছবি অস্পষ্ট বা অসম্পূর্ণ হলে সেটা স্পষ্ট বলো।
- সহজ বাংলায় লেখো; ইংরেজি বিষয়ে প্রয়োজনে ইংরেজি ব্যবহার করো।`;

const GENQ_SYS = `তুমি বাংলাদেশের অভিজ্ঞ প্রশ্নপ্রণেতা। শুধু বৈধ JSON অ্যারে আউটপুট দাও — কোনো ভূমিকা, মার্কডাউন বা ব্যাখ্যা নয়।
প্রতিটি আইটেম: {"q":"প্রশ্ন","o":["অপশন১","অপশন২","অপশন৩","অপশন৪"],"a":সঠিক_অপশনের_ইনডেক্স(0-3),"m":1}
নিয়ম:
- বহুনির্বাচনি (MCQ); ঠিক একটি উত্তর সঠিক; বাকিগুলো বিশ্বাসযোগ্য ভুল (distractor)।
- অপশনে "ক)/খ)" ইত্যাদি লেবেল লিখবে না। প্রশ্ন একটি লাইনে।
- সঠিক উত্তরের অবস্থান (a) এলোমেলো রাখো।
- তথ্যগতভাবে নির্ভুল ও পাঠ্যবইভিত্তিক হবে; অস্পষ্ট বা দ্ব্যর্থক প্রশ্ন নয়।
- বাংলা বিষয়ে বাংলা সংখ্যা, ইংরেজি বিষয়ে ইংরেজিতে লেখো।
- "avoid" তালিকার প্রশ্নের মতো প্রশ্ন আবার করবে না।`;

const SCAN_SYS = `তুমি একজন নির্ভুল OCR ও প্রশ্ন-ডিজিটাইজার। ছবিতে ছাপা MCQ প্রশ্নপত্র আছে (বাংলা-ইংরেজি মেশানো; রসায়ন/গণিতের চিহ্নসহ)। ছবির প্রশ্নগুলো হুবহু তুলে এনে শুধু বৈধ JSON অ্যারে দাও — কোনো ভূমিকা, মার্কডাউন বা ব্যাখ্যা নয়।
প্রতিটি আইটেম: {"n":ছবির_প্রশ্ননম্বর_বা_null,"q":"প্রশ্ন","o":["অপশন১","অপশন২","অপশন৩","অপশন৪"],"a":-1,"m":1}
নিয়ম:
- ছবিতে যত সম্পূর্ণ প্রশ্ন দেখা যায় সব, ছবির ক্রমে। কাটা পড়া/অসম্পূর্ণ প্রশ্ন বাদ দাও।
- প্রশ্ন ও অপশনের ভাষা, বানান ও সংখ্যা হুবহু রাখো; ইংরেজি অংশ ইংরেজিতেই থাকবে। প্রশ্ন নম্বর ("41.") ও অপশনের লেবেল ("a)", "b)", "ক)") লিখবে না; নম্বরটি শুধু "n"-এ দেবে।
- রাসায়নিক সূত্র ও এককে সাবস্ক্রিপ্ট/সুপারস্ক্রিপ্ট ইউনিকোডে লেখো (H₂SO₄, NH₃, V₂O₅, mol⁻¹, °C)।
- হাতের কলমের দাগ, কাটাকুটি বা ছোপ উপেক্ষা করে নিচের ছাপা লেখাটি পড়ো। ছাপা লেখা সত্যিই পড়া না গেলে সেই অপশন "" (খালি) রাখো; অনুমান করে বানিয়ে লিখবে না।
- লাইন ভেঙে যাওয়া প্রশ্ন জোড়া লাগিয়ে এক লাইনে লেখো (হাইফেনে ভাঙা শব্দও জোড়া: "কয়-" + "টি" → "কয়টি")।
- ফাঁকা স্থান ("---") থাকলে "---"ই রাখো।
- ঠিক ৪টি অপশন দাও। ছবিতে কম থাকলে বাকিটা "" রাখো; বেশি থাকলে প্রথম ৪টি।
- উত্তর বের করার চেষ্টা করবে না: "a" সবসময় -1, "m" সবসময় 1।`;

const SOLVE_SYS = `তুমি বাংলাদেশের এইচএসসি/এডমিশন মানের অভিজ্ঞ শিক্ষক। নিচের MCQ-গুলোর সঠিক উত্তর বের করো। শুধু বৈধ JSON অ্যারে দাও: [{"i":প্রশ্নের_ক্রমিক,"a":সঠিক_অপশনের_ইনডেক্স,"c":"high|medium|low"}]
- ইনডেক্স: ০=ক(প্রথম), ১=খ, ২=গ, ৩=ঘ।
- "সত্য নয়", "অংশ নয়", "ভুল" ধরনের নেগেটিভ প্রশ্নে বিশেষ সতর্ক থাকো।
- সংখ্যাভিত্তিক প্রশ্নে হিসাব করে মেলাও। বাংলাদেশের পাঠ্যবইয়ের (NCTB) মান ও মানবিক সূত্র অনুসরণ করো।
- নিশ্চিত না হলে "c":"low" দাও, তবু সেরা অনুমানটি দাও।`;

function cleanScan(arr) {
  return (Array.isArray(arr) ? arr : [])
    .filter((x) => x && typeof x.q === 'string' && x.q.trim() && Array.isArray(x.o))
    .map((x) => {
      const o = x.o.slice(0, 4).map((v) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim());
      while (o.length < 4) o.push('');
      return { n: Number.isInteger(x.n) ? x.n : null, q: x.q.replace(/\s+/g, ' ').trim(), o, a: -1, m: 1 };
    });
}

function parseJSON(txt) {
  const a = txt.indexOf('['), b = txt.lastIndexOf(']');
  if (a < 0 || b <= a) throw new Error('AI সঠিক ফরম্যাটে উত্তর দেয়নি, আবার চেষ্টা করুন');
  return JSON.parse(txt.slice(a, b + 1));
}

const EXPLAIN_SYS = `তুমি "AI মশাই" — স্নেহশীল AI শিক্ষক। শুধু বৈধ JSON অ্যারে দাও, কোনো ভূমিকা/মার্কডাউন নয়: [{"i":প্রশ্নের_নম্বর,"e":"ব্যাখ্যা"}]
প্রতিটি ভুল প্রশ্নের জন্য ২–৩ বাক্যে (৬০ শব্দের মধ্যে) সহজ বাংলায় লেখো: কেন সঠিক উত্তরটি সঠিক, আর শিক্ষার্থীর বাছাই করা উত্তরটি কোথায় ভুল। শেষে চাইলে মনে রাখার একটি ছোট টিপস দাও।
- দেওয়া "সঠিক উত্তর"কে সঠিক ধরেই ব্যাখ্যা করো। তবে সেটি নিশ্চিতভাবে ভুল মনে হলে ব্যাখ্যার শুরুতে "⚠️ উত্তরমালাটি আরেকবার যাচাই করুন।" লিখে কারণ বলো।
- সহানুভূতিশীল ও উৎসাহব্যঞ্জক সুরে লেখো। তথ্য বানিয়ে বলো না।`;

const dhakaDay = () => new Date(Date.now() + 6 * 3600e3).toISOString().slice(0, 10);
const cleanQs = (arr) => (Array.isArray(arr) ? arr : [])
  .filter((x) => x && typeof x.q === 'string' && Array.isArray(x.o) && x.o.length === 4 && x.o.every((o) => typeof o === 'string' && o.trim()) && Number.isInteger(x.a) && x.a >= 0 && x.a <= 3)
  .map((x) => ({ q: x.q.replace(/\s+/g, ' ').trim(), o: x.o.map((o) => o.replace(/\s+/g, ' ').trim()), a: x.a, m: 1 }));

// আজকের AI কুইজ (শ্রেণি অনুযায়ী দিনে একটি সেট; প্রথমজন চাইলে তৈরি হয়ে জমা থাকে)
async function getQuiz(cls, day, create) {
  const got = await sb(`/rest/v1/ai_daily_quiz?class_level=eq.${cls}&day=eq.${day}&select=q`);
  if (got && got[0] && Array.isArray(got[0].q) && got[0].q.length) return got[0].q;
  if (!create) return null;
  let n = 5;
  try {
    const c = await sb('/rest/v1/ai_config?key=eq.aiq_count&select=val');
    if (c && c[0]) n = Math.max(1, Math.min(10, parseInt(c[0].val) || 5));
  } catch (e) {}
  const subj = cls >= 13 ? 'সাধারণ জ্ঞান, গণিত, ইংরেজি, বাংলা (এডমিশন পরীক্ষার মান)' : 'শ্রেণির মূল বিষয়গুলো (গণিত, বিজ্ঞান, ইংরেজি, বাংলা, বাংলাদেশ ও বিশ্বপরিচয় ইত্যাদি) থেকে মিশিয়ে';
  const prompt = `শ্রেণি: ${CLS[cls] || cls}\nবিষয়: ${subj}\nকাঠিন্য: মাঝারি\nপ্রশ্নসংখ্যা: ${n}\nতারিখ: ${day} (প্রতিদিন নতুন প্রশ্ন দাও)\nবিভিন্ন বিষয় থেকে একটি করে প্রশ্ন দাও, একই বিষয়ের পুনরাবৃত্তি কম রাখো।\navoid: []`;
  let qs = [];
  for (let k = 0; k < 2 && qs.length < n; k++) {
    try {
      const out = await claude({ model: SMART, system: GENQ_SYS, messages: [{ role: 'user', content: prompt }], max_tokens: 4000, json: true });
      cleanQs(parseJSON(out)).forEach((x) => { if (qs.length < n && !qs.some((y) => y.q === x.q)) qs.push(x); });
    } catch (e) { if (k === 1 && !qs.length) throw e; }
  }
  if (qs.length < Math.min(3, n)) throw new Error('আজকের কুইজ তৈরি হয়নি, একটু পরে আবার চেষ্টা করুন');
  await sb('/rest/v1/ai_daily_quiz', { method: 'POST', headers: { Prefer: 'resolution=ignore-duplicates' }, body: JSON.stringify({ class_level: cls, day, q: qs }) }).catch(() => {});
  const again = await sb(`/rest/v1/ai_daily_quiz?class_level=eq.${cls}&day=eq.${day}&select=q`);
  return (again && again[0] && again[0].q) || qs;
}

module.exports = async (req, res) => {
  res.setHeader('Cache-Control', 'no-store');
  if (req.method !== 'POST') return res.status(405).json({ error: 'POST দিন' });
  try {
    if (!SB || !SK) return res.status(500).json({ error: 'সার্ভারে SUPABASE_URL / SUPABASE_SERVICE_KEY সেট করা নেই' });
    const u = await authUser(req);
    if (!u) return res.status(401).json({ error: 'লগইন করুন' });
    const b = typeof req.body === 'string' ? JSON.parse(req.body || '{}') : req.body || {};
    const act = b.action;

    if (act === 'health') {
      if (!(await isAdmin(u.id))) return res.status(403).json({ error: 'শুধু অ্যাডমিন' });
      const has = (k) => !!process.env[k];
      return res.json({
        ok: true,
        env: Object.fromEntries(
          ['SUPABASE_URL', 'SUPABASE_SERVICE_KEY', 'GEMINI_API_KEY', 'WA_TOKEN', 'WA_PHONE_ID', 'CRON_SECRET', 'SITE_URL'].map((k) => [k, has(k)])
        ),
      });
    }

    if (!GK) return res.status(500).json({ error: 'সার্ভারে GEMINI_API_KEY সেট করা নেই' });

    if (act === 'genq') {
      if (!(await isStaff(u.id))) return res.status(403).json({ error: 'শুধু অ্যাডমিন বা অনুমোদিত শিক্ষক' });
      const n = Math.max(1, Math.min(8, parseInt(b.count) || 6));
      const avoid = (b.avoid || []).slice(-40).map((s) => String(s).slice(0, 80));
      const prompt = `শ্রেণি: ${CLS[b.class_level] || b.class_level || 'উল্লেখ নেই'}
বিষয়: ${String(b.subject || '').slice(0, 80)}
অধ্যায়/টপিক: ${String(b.chapter || '').slice(0, 120)}
কাঠিন্য: ${String(b.difficulty || 'বার্ষিক পরীক্ষার মান').slice(0, 40)}
প্রশ্নসংখ্যা: ${n}
${b.notes ? 'এই নোট/টেক্সটের ভিত্তিতে বানাও:\n' + String(b.notes).slice(0, 6000) : ''}
avoid: ${JSON.stringify(avoid)}`;
      const out = await claude({ model: SMART, system: GENQ_SYS, messages: [{ role: 'user', content: prompt }], max_tokens: 6000, json: true });
      const arr = parseJSON(out)
        .filter((x) => x && typeof x.q === 'string' && Array.isArray(x.o) && x.o.length === 4 && x.o.every((o) => typeof o === 'string' && o.trim()) && Number.isInteger(x.a) && x.a >= 0 && x.a <= 3)
        .map((x) => ({ q: x.q.replace(/\s+/g, ' ').trim(), o: x.o.map((o) => o.replace(/\s+/g, ' ').trim()), a: x.a, m: Math.max(1, parseInt(x.m) || 1) }));
      return res.json({ questions: arr });
    }

    if (act === 'scanq') {
      if (!(await isStaff(u.id))) return res.status(403).json({ error: 'শুধু অ্যাডমিন বা অনুমোদিত শিক্ষক' });
      const img = typeof b.image === 'string' ? b.image.replace(/^data:[^,]+,/, '') : '';
      if (!img) return res.status(400).json({ error: 'ছবি দিন' });
      if (img.length > 4_000_000) return res.status(413).json({ error: 'ছবি বেশি বড়, ছোট করে আবার দিন' });
      const hint = (b.class_level ? `\nশ্রেণি: ${CLS[b.class_level] || b.class_level}` : '') + (b.subject ? `\nবিষয়: ${String(b.subject).slice(0, 80)}` : '');
      const out = await claude({
        model: SMART, system: SCAN_SYS, max_tokens: 12000, json: true,
        messages: [{ role: 'user', content: [{ type: 'image', source: { media_type: 'image/jpeg', data: img } }, { type: 'text', text: 'এই ছবির সব MCQ প্রশ্ন JSON-এ দাও।' + hint }] }],
      });
      const arr = cleanScan(parseJSON(out));
      if (!arr.length) return res.status(422).json({ error: 'ছবিতে কোনো প্রশ্ন পাওয়া যায়নি। ছবিটি সোজা ও স্পষ্ট করে আবার তুলুন।' });
      let solved = false, note = '';
      if (b.solve !== false) {
        try {
          const sp = arr.map((x, i) => `${i}. ${x.q}\n` + x.o.map((o, k) => `(${'কখগঘ'[k]}) ${o}`).join('\n')).join('\n\n') + hint;
          const so = await claude({ model: SMART, system: SOLVE_SYS, messages: [{ role: 'user', content: sp }], max_tokens: 12000, json: true, think: 2048 });
          parseJSON(so).forEach((r) => {
            if (r && Number.isInteger(r.i) && arr[r.i] && Number.isInteger(r.a) && r.a >= 0 && r.a <= 3) {
              arr[r.i].a = r.a;
              arr[r.i].c = ['high', 'medium', 'low'].includes(r.c) ? r.c : 'medium';
            }
          });
          solved = arr.some((x) => x.a >= 0);
        } catch (e) { note = 'উত্তর বের করা যায়নি: ' + e.message; }
      }
      return res.json({ questions: arr, solved, note });
    }

    if (u.is_anonymous || !u.email) return res.status(403).json({ error: 'এই ফিচারের জন্য ইমেইল/Google অ্যাকাউন্টে লগইন করুন' });

    if (act === 'tutor') {
      let msgs = (b.messages || []).slice(-10).map((m) => ({
        role: m.role === 'assistant' ? 'assistant' : 'user',
        content: String(m.content || '').slice(0, 2000),
      })).filter((m) => m.content);
      while (msgs.length && msgs[0].role !== 'user') msgs.shift();
      if (!msgs.length || msgs[msgs.length - 1].role !== 'user') return res.status(400).json({ error: 'প্রশ্ন লিখুন' });
      const how = await rpc('ai_charge', { p_user: u.id, p_kind: 'tutor' });
      if (how === 'none') return res.status(402).json({ error: 'আজকের ফ্রি মেসেজ শেষ। কয়েন শপ থেকে "মশাই বুস্ট" কিনুন অথবা কাল আবার আসুন।' });
      try {
        const sys = TUTOR_SYS + (b.class_level ? `\nশিক্ষার্থীর শ্রেণি: ${CLS[b.class_level] || b.class_level}` : '');
        const reply = await claude({ model: FAST, system: sys, messages: msgs, max_tokens: 1000 });
        return res.json({ reply, how });
      } catch (e) {
        await rpc('ai_refund', { p_user: u.id, p_kind: 'tutor', p_how: how }).catch(() => {});
        throw e;
      }
    }

    if (act === 'doubt') {
      const q = String(b.question || '').trim().slice(0, 3000);
      const img = typeof b.image === 'string' ? b.image : '';
      if (!q && !img) return res.status(400).json({ error: 'প্রশ্ন লিখুন বা ছবি দিন' });
      if (img.length > 3_000_000) return res.status(413).json({ error: 'ছবি বেশি বড়' });
      const how = await rpc('ai_charge', { p_user: u.id, p_kind: 'doubt' });
      if (how === 'none') return res.status(402).json({ error: 'আজকের ফ্রি ডাউট শেষ এবং যথেষ্ট কয়েন নেই। কয়েন শপ থেকে ডাউট প্যাক কিনুন।' });
      try {
        const content = [];
        if (img) content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: img } });
        content.push({ type: 'text', text: (b.subject ? 'বিষয়: ' + String(b.subject).slice(0, 60) + '\n' : '') + (q || 'ছবির প্রশ্নটি সমাধান করো।') });
        const ans = await claude({ model: SMART, system: DOUBT_SYS, messages: [{ role: 'user', content }], max_tokens: 2500 });
        await sb('/rest/v1/doubts', {
          method: 'POST',
          body: JSON.stringify({ user_id: u.id, subject: b.subject || null, question: q || '(ছবি)', answer: ans, had_image: !!img }),
        }).catch(() => {});
        return res.json({ answer: ans, how });
      } catch (e) {
        await rpc('ai_refund', { p_user: u.id, p_kind: 'doubt', p_how: how }).catch(() => {});
        throw e;
      }
    }

    if (act === 'explain') {
      const raw = Array.isArray(b.items) ? b.items.slice(0, 15) : [];
      const items = raw.map((x, i) => ({
        i,
        body: String((x && x.body) || '').slice(0, 500),
        options: (Array.isArray(x && x.options) ? x.options : []).slice(0, 6).map((o) => String(o).slice(0, 200)),
        correct: Number.isInteger(x && x.correct) ? x.correct : -1,
        chosen: Number.isInteger(x && x.chosen) ? x.chosen : -1,
      })).filter((x) => x.body && x.options.length >= 2 && x.correct >= 0 && x.correct < x.options.length);
      if (!items.length) return res.status(400).json({ error: 'ব্যাখ্যা করার মতো প্রশ্ন পাওয়া যায়নি' });
      const how = await rpc('ai_charge', { p_user: u.id, p_kind: 'explain' });
      if (how === 'none') return res.status(402).json({ error: 'আজকের ফ্রি ব্যাখ্যা শেষ এবং যথেষ্ট কয়েন নেই। পরীক্ষা দিয়ে কয়েন জমান, অথবা কাল আবার আসুন।' });

        const out = await claude({ model: SMART, system: EXPLAIN_SYS, messages: [{ role: 'user', content: prompt }], max_tokens: 4000, json: true });
        const arr = parseJSON(out).filter((x) => x && Number.isInteger(x.i) && typeof x.e === 'string' && x.e.trim()).map((x) => ({ i: x.i, e: x.e.trim() }));
        if (!arr.length) throw new Error('ব্যাখ্যা তৈরি হয়নি, আবার চেষ্টা করুন');
        return res.json({ explanations: arr, how });
      } catch (e) {
        await rpc('ai_refund', { p_user: u.id, p_kind: 'explain', p_how: how }).catch(() => {});
        throw e;
      }
    }

    if (act === 'aiq_get' || act === 'aiq_submit') {
      const cls = parseInt(b.class_level);
      if (!(cls >= 1 && cls <= 13)) return res.status(400).json({ error: 'শ্রেণি বেছে নিন' });
      const day = dhakaDay();
      if (act === 'aiq_get') {
        const done = await sb(`/rest/v1/ai_daily_done?user_id=eq.${u.id}&day=eq.${day}&select=score,total`);
        if (done && done[0]) return res.json({ done: true, score: done[0].score, total: done[0].total });
        const quiz = await getQuiz(cls, day, true);
        return res.json({ done: false, day, questions: quiz.map((x) => ({ q: x.q, o: x.o })) });
      }
      const quiz = await getQuiz(cls, day, false);
      if (!quiz) return res.status(400).json({ error: 'আগে আজকের কুইজটি খুলুন' });
      const ans = Array.isArray(b.answers) ? b.answers : [];
      let score = 0;
      quiz.forEach((x, i) => { if (Number.isInteger(ans[i]) && ans[i] === x.a) score++; });
      const coins = await rpc('ai_quiz_award', { p_user: u.id, p_day: day, p_cls: cls, p_score: score, p_total: quiz.length });
      if (coins === -1) return res.status(409).json({ error: 'আজকের কুইজ আগেই জমা দেওয়া হয়েছে। কাল নতুন কুইজ আসবে!' });
      return res.json({ score, total: quiz.length, coins, keys: quiz.map((x) => x.a), questions: quiz.map((x) => ({ q: x.q, o: x.o })) });
    }

    return res.status(400).json({ error: 'অজানা action' });
  } catch (e) {
    return res.status(500).json({ error: String((e && e.message) || e) });
  }
};

<script type="text/plain" id="v2-wa">
// api/wa.js — WhatsApp Cloud API: ফলাফল PDF, সকালের প্রশ্ন + স্ট্রিক, সাপ্তাহিক অভিভাবক রিপোর্ট
// Env: SUPABASE_URL, SUPABASE_SERVICE_KEY, GEMINI_API_KEY, WA_TOKEN, WA_PHONE_ID, CRON_SECRET, SITE_URL
// ঐচ্ছিক: WA_TPL_RESULT, WA_TPL_DAILY, WA_TPL_WEEKLY, WA_LANG, WA_GRAPH_VERSION, AI_MODEL_SMART, AI_MODEL_FALLBACK
const SB = process.env.SUPABASE_URL;
const SK = process.env.SUPABASE_SERVICE_KEY;
const GK = process.env.GEMINI_API_KEY;
const WT = process.env.WA_TOKEN;
const PID = process.env.WA_PHONE_ID;
const GV = process.env.WA_GRAPH_VERSION || 'v23.0';
const LANG = process.env.WA_LANG || 'bn';
const SITE = process.env.SITE_URL || '';
const SMART = process.env.AI_MODEL_SMART || 'gemini-3.8-flash';
const FALLBACKS = (process.env.AI_MODEL_FALLBACK || 'gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3.8-flash').split(',').map((x) => x.trim()).filter(Boolean);
const TPL = {
  result: process.env.WA_TPL_RESULT || 'exam_result_pdf',
  daily: process.env.WA_TPL_DAILY || 'daily_question',
  weekly: process.env.WA_TPL_WEEKLY || 'weekly_report',

async function sb(path, opt = {}) {
  const r = await fetch(SB + path, {
    ...opt,
    headers: { apikey: SK, Authorization: 'Bearer ' + SK, 'Content-Type': 'application/json', ...(opt.headers || {}) },
  });
  const t = await r.text();
  let j = null;
  try { j = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && (j.message || j.error)) || 'DB ' + r.status);
  return j;
}
async function authUser(req) {
  const t = (req.headers.authorization || '').replace(/^Bearer\s+/i, '');
  if (!t) return null;
  const r = await fetch(SB + '/auth/v1/user', { headers: { apikey: SK, Authorization: 'Bearer ' + t } });
  if (!r.ok) return null;
  const u = await r.json();
  return u && u.id ? u : null;
}
async function isAdmin(id) {
  const r = await sb('/rest/v1/admins?user_id=eq.' + id + '&select=user_id');
  return Array.isArray(r) && r.length > 0;
}

const bn = (n) => String(n).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);
const flat = (s, max = 900) => String(s == null ? '' : s).replace(/[\r\n\t]+/g, ' ').replace(/ {2,}/g, ' ').trim().slice(0, max);
const dkey = (ms) => new Date(ms + 6 * 3600e3).toISOString().slice(0, 10); // ঢাকা সময়ের তারিখ
const today = () => dkey(Date.now());
const CLS = { 1: 'প্রথম', 2: 'দ্বিতীয়', 3: 'তৃতীয়', 4: 'চতুর্থ', 5: 'পঞ্চম', 6: 'ষষ্ঠ', 7: 'সপ্তম', 8: 'অষ্টম', 9: 'নবম', 10: 'দশম', 11: 'একাদশ', 12: 'দ্বাদশ', 13: 'এডমিশন' };
const SUBJ = ['সাধারণ জ্ঞান', 'গণিত', 'বিজ্ঞান', 'ইংরেজি', 'বাংলা', 'বাংলাদেশ ও বিশ্বপরিচয়', 'গণিত']; // রবি→শনি (UTC weekday 0=রবি)

async function pool(items, n, fn) {
  const out = [];
  let i = 0;
  await Promise.all(
    Array.from({ length: Math.min(n, items.length) }, async () => {
      while (i < items.length) {
        const k = i++;
        out[k] = await fn(items[k]).catch((e) => ({ error: String((e && e.message) || e) }));
      }
    })
  );
  return out;
}

async function wlog(user_id, kind, ok, info) {

}

async function sendTemplate(to, name, params, header, lang) {
  const components = [];

    method: 'POST',
