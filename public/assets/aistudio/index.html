/* ===== লিডারবোর্ড ম্যানেজ: অ্যাডমিন এডিট + ডিলিট ===== */
var LB_SQL=[
"-- লিডারবোর্ড এডিট/ডিলিট (শুধু অ্যাডমিন)। বারবার Run করলেও সমস্যা নেই।",
"create or replace function public.admin_lb_update(p_result_id text,p_score numeric,p_total numeric) returns text",
"language plpgsql security definer set search_path=public as $f$",
"begin",
"  if not public.sub_is_admin() then raise exception 'শুধু অ্যাডমিন পারবেন'; end if;",
"  if p_score is null or p_total is null or p_total<=0 or p_score<0 or p_score>p_total then raise exception 'স্কোর ০ থেকে মোট নম্বরের মধ্যে হতে হবে'; end if;",
"  update public.results set score=p_score,total=p_total where id::text=p_result_id;",
"  if not found then raise exception 'ফলাফল পাওয়া যায়নি'; end if;",
"  return 'ok';",
"end $f$;",
"",
"create or replace function public.admin_lb_rename(p_user uuid,p_name text) returns text",
"language plpgsql security definer set search_path=public as $f$",
"begin",
"  if not public.sub_is_admin() then raise exception 'শুধু অ্যাডমিন পারবেন'; end if;",
"  if coalesce(trim(p_name),'')='' then raise exception 'নাম খালি রাখা যাবে না'; end if;",
"  update public.results set student_name=trim(p_name) where user_id=p_user;",
"  begin",
"    update auth.users set raw_user_meta_data=coalesce(raw_user_meta_data,'{}'::jsonb)||jsonb_build_object('full_name',trim(p_name)) where id=p_user;",
"  exception when others then null;",
"  end;",
"  return 'ok';",
"end $f$;",
"",
"create or replace function public.admin_lb_delete(p_user uuid,p_exam text,p_reset boolean) returns text",
"language plpgsql security definer set search_path=public as $f$",
"declare r record;",
"begin",
"  if not public.sub_is_admin() then raise exception 'শুধু অ্যাডমিন পারবেন'; end if;",
"  if p_reset then",
"    for r in select distinct exam_id from public.results where user_id=p_user and (p_exam is null or exam_id::text=p_exam) loop",
"      perform public.admin_reset(p_user,r.exam_id);",
"    end loop;",
"  end if;",
"  delete from public.results where user_id=p_user and (p_exam is null or exam_id::text=p_exam);",
"  return 'ok';",
"end $f$;",
"",
"create or replace function public.admin_lb_delete_result(p_result_id text,p_reset boolean) returns text",
"language plpgsql security definer set search_path=public as $f$",
"declare r record;",
"begin",
"  if not public.sub_is_admin() then raise exception 'শুধু অ্যাডমিন পারবেন'; end if;",
"  select user_id,exam_id into r from public.results where id::text=p_result_id;",
"  if not found then raise exception 'ফলাফল পাওয়া যায়নি'; end if;",
"  if p_reset then perform public.admin_reset(r.user_id,r.exam_id); end if;",
"  delete from public.results where id::text=p_result_id;",
"  return 'ok';",
"end $f$;",
"",
"revoke all on function public.admin_lb_update(text,numeric,numeric) from public,anon;",
"revoke all on function public.admin_lb_rename(uuid,text) from public,anon;",
"revoke all on function public.admin_lb_delete(uuid,text,boolean) from public,anon;",
"revoke all on function public.admin_lb_delete_result(text,boolean) from public,anon;",
"grant execute on function public.admin_lb_update(text,numeric,numeric) to authenticated;",
"grant execute on function public.admin_lb_rename(uuid,text) to authenticated;",
"grant execute on function public.admin_lb_delete(uuid,text,boolean) to authenticated;",
"grant execute on function public.admin_lb_delete_result(text,boolean) to authenticated;"
].join("\n");

function admLb(){

   '<details id="lbm_setup"><summary><b>⚙️ প্রথমবার সেটআপ (একবারই করতে হবে)</b></summary>'+
   '<p style="font-size:.88rem;margin-top:8px">Supabase → SQL Editor-এ নিচের SQL কপি করে একবার Run করুন। এটা আগের কোনো টেবিল/ফাংশন বদলায় না।</p>'+

  var b=mk("button","🥇 লিডারবোর্ড","ghost");b.dataset.t="lbm";tabs.appendChild(b);

  function hint(e){return e.message+(/function|admin_lb_/i.test(e.message)?" — আগে নিচের “প্রথমবার সেটআপ” থেকে SQL চালান।":"")}

  async function load(){
    msg("");
    var r=await D().from("results").select("id,user_id,exam_id,score,total,student_name,created_at,exams(title)").order("created_at",{ascending:false});

    var seen={};
    rows.forEach(function(x){if(x.exams&&!seen[x.exam_id]){seen[x.exam_id]=1;var o=mk("option",x.exams.title);o.value=x.exam_id;sel.appendChild(o)}});

  function draw(){
    var ex=$("lbm_ex").value,nq=$("lbm_q").value.trim().toLowerCase(),box=$("lbm_list");

    var by={};
    rows.forEach(function(x){
      if(ex&&String(x.exam_id)!==ex)return;
      var k=x.user_id||("anon_"+x.id);
      var u=by[k]||(by[k]={uid:x.user_id,name:x.student_name||"(নামহীন)",score:0,total:0,items:[]});
      u.score+=Number(x.score)||0;u.total+=Number(x.total)||0;u.items.push(x);
    });
    var list=Object.keys(by).map(function(k){return by[k]}).sort(function(a,c){return c.score-a.score||a.total-c.total});
    list.forEach(function(u){u.rank=1+list.filter(function(o){return o.score>u.score}).length});
    var shown=list.filter(function(u){return !nq||u.name.toLowerCase().indexOf(nq)>=0});
    if(!shown.length){box.textContent="কোনো ফলাফল নেই।";return}

        db_.disabled=true;

        msg("✅ মুছে ফেলা হয়েছে।",true);load();
      };

    top.appendChild(l);top.appendChild(bt);d.appendChild(top);

    var ed=mk("div",null,"hide");ed.style.marginTop="10px";

function calc(row,d,ans){
  var raw=0,wm=0,tm=0,r=0,w=0,s=0;
  row.perm.forEach(function(p){var q=d.qm[p.q];if(!q)return;var m=q.marks||1;tm+=m;var a=ans[p.q];
    if(a==null){s++;return}
    if(a===d.key[p.q]){raw+=m;r++}else{wm+=m;w++}});
  var neg=+d.exam.neg_mark||0;
  return {score:Math.round(Math.max(0,raw-wm*neg)*100)/100,total:tm,r:r,w:w,s:s,raw:raw,pen:Math.round(wm*neg*100)/100};
}

function apFill(){
  var tas=apTAs();if(!tas.length){apMsg("আগে প্রশ্ন আনুন।");return}
  var map={},cur=null;
  $("ap_paste").value.split("\n").forEach(function(raw){

    var m=l.match(/^([০-৯0-9]{1,3})\s*[\.\):\-–]\s*([\s\S]*)$/);
    if(m){cur=parseInt(bdig(m[1]),10);map[cur]=m[2].trim()}
    else if(cur!=null)map[cur]=((map[cur]||"")+"\n"+l).trim();
  });

async function apAiCall(body){
  var s=await D().auth.getSession(),t=s&&s.data&&s.data.session&&s.data.session.access_token;
  if(!t)throw new Error("লগইন করুন");
  var r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify(body)});
  var j={};try{j=await r.json()}catch(e){}
  if(r.status===404)throw new Error("এআই সার্ভার চালু হয়নি। অ্যাডমিনকে জানান।");
  if(!r.ok)throw new Error(j.error||("সার্ভার ত্রুটি "+r.status));
  return j;
}
/* ফাঁকা ব্যাখ্যাগুলো AI-তে পাঠানো (১৫টি করে), ফল সাথে সাথে সংরক্ষণ */
async function apAI(){
  var tas=apTAs(),d=AP.d;if(!d||!tas.length){apMsg("আগে প্রশ্ন আনুন।");return}
  var targets=[];
  tas.forEach(function(t,i){
    if(t.value.trim())return;
    var q=d.qs[i];if(d.key[q.id]!=null)targets.push({t:t,q:q,ci:d.key[q.id]});
  });
  if(!targets.length){apMsg("সব প্রশ্নে ব্যাখ্যা আছে, অথবা সঠিক উত্তর সেট নেই।",true);return}
  var done=0;
  try{
    for(var b=0;b<targets.length;b+=15){
      var chunk=targets.slice(b,b+15);
      apMsg("🤖 AI ব্যাখ্যা লিখছে… ("+bn(Math.min(b+15,targets.length))+"/"+bn(targets.length)+")",true);
      var j=await apAiCall({action:"explain",items:chunk.map(function(x){
        return {body:stripMd(x.q.body),options:(x.q.options||[]).map(function(o){return String(o==null?"":o)}),correct:x.ci,chosen:-1};
      })});
      var up=[];
      (j.explanations||[]).forEach(function(x){
        var tg=chunk[x.i];if(!tg||!x.e)return;
        tg.t.value=x.e;tg.t.dataset.orig=x.e;
        up.push({question_id:tg.t.dataset.qid,explanation:x.e,source:"ai"});
      });
      if(up.length){var r=await D().from("question_explain").upsert(up,{onConflict:"question_id"});if(r.error)throw r.error}
      done+=up.length;
    }
    apMsg("🤖 "+bn(done)+"টি প্রশ্নের AI ব্যাখ্যা বসে সংরক্ষিত হয়েছে।",true);
  }catch(e){apMsg(apHint(e))}
}

window.openOffScan=function(){

  if(!U){alert("পেজ রিফ্রেশ করে আবার চেষ্টা করুন।");return}

  var tip=el("small","পুরো উত্তরপত্র (চার কোণের কালো চিহ্ন ও QR-সহ) ছবির ভেতরে রাখুন। আলো সমান ও ছবি পরিষ্কার হলে ভালো পড়ে। জমা দেওয়ার আগে আপনি নিজে মিলিয়ে ঠিক করে নিতে পারবেন।");
  tip.style.cssText="display:block;opacity:.8;margin-bottom:8px";k.appendChild(tip);
  var bar=el("div",null,"osb"),shot=el("button","📸 ছবি তুলুন"),up=el("button","🖼️ ছবি আপলোড","ghost");
  var fs=document.createElement("input");fs.type="file";fs.accept="image/*";fs.setAttribute("capture","environment");fs.className="hide";
  var fu=document.createElement("input");fu.type="file";fu.accept="image/*";fu.className="hide";
  bar.appendChild(shot);bar.appendChild(up);bar.appendChild(fs);bar.appendChild(fu);k.appendChild(bar);
  var cr=el("div",null,"osb"),ci=document.createElement("input");ci.placeholder="অথবা সেট কোড (QR-এর নিচে লেখা)";ci.style.cssText="max-width:230px;margin:0";
  var cb=el("button","খুলুন","ghost");cr.appendChild(ci);cr.appendChild(cb);k.appendChild(cr);
  var status=el("div",null,"err");k.appendChild(status);
  var entry=el("div");k.appendChild(entry);
  closeBtn(v);

  shot.onclick=function(){fs.click()};up.onclick=function(){fu.click()};
  function pick(e){var f=e.target.files&&e.target.files[0];e.target.value="";if(f)readImage(f)}
  fs.onchange=pick;fu.onchange=pick;
  cb.onclick=async function(){
    var c=String(ci.value||"").trim().toUpperCase().replace(/^OS\d?-/,"");if(!c)return;

  async function getInfo(code){
    var r=await db.rpc("offline_sheet_info",{p_code:code});
    if(r.error){say(hintMsg(r.error.message));return null}
    var d=r.data||{};
    if(d.taken){say("এই উত্তরপত্রটি ইতিমধ্যে অন্য একজন জমা দিয়েছেন। ভুল মনে হলে শিক্ষককে জানান।");return null}
    if(d.done){
      entry.innerHTML="";var b=el("div",null,"card");
      b.appendChild(el("b","✅ এই উত্তরপত্র আপনি আগেই জমা দিয়েছেন।"));
      var rb=el("button","📄 আমার উত্তরপত্র ও ফলাফল দেখুন");rb.style.marginTop="8px";
      rb.onclick=async function(){
        var g=await db.rpc("get_review",{p_result_id:d.result_id});
        if(g.error||!g.data){say("উত্তরপত্র দেখা যাচ্ছে না।");return}
        v.o.remove();U.review(g.data);

  async function readImage(f){
    say("");entry.innerHTML="";entry.appendChild(el("p","⏳ ছবি পড়া হচ্ছে…"));
    var info=null;
    try{
      var OM=window.__omr;if(!OM)throw new Error("স্ক্যানার চালু হয়নি। পেজ রিফ্রেশ করে আবার চেষ্টা করুন।");
      await OM.needJsQR();
      var bmp=await loadBmp(f),sc=Math.min(1,2400/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
      var cv=document.createElement("canvas");cv.width=w;cv.height=h;
      var cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(bmp,0,0,w,h);
      var im=cx.getImageData(0,0,w,h),q=window.jsQR(im.data,w,h,{inversionAttempts:"dontInvert"});
      if(!q||!/^OS\d?-/i.test(String(q.data).trim()))throw new Error("ছবিতে QR পাওয়া যায়নি। পুরো উত্তরপত্র একটু দূর থেকে, ঝাপসা ছাড়া তুলুন।");
      var ver=(function(t){return /^OS4-/i.test(t)?4:/^OS3-/i.test(t)?3:/^OS2-/i.test(t)?2:1})(String(q.data).trim()),code=String(q.data).trim().toUpperCase().replace(/^OS\d?-/,"");
      info=await getInfo(code);if(!info){if(!entry.firstChild||entry.firstChild.tagName==="P")entry.innerHTML="";return}
      var pre=null;
      try{
        var res=OM.omrCore(im,q.location,info.perm,ver);OM.omrDraw(cv,res,info.perm);
        pre={picks:res.picks,flags:res.flags,cv:cv,roll:res.roll};
      }catch(e2){say("ছবি থেকে উত্তর পড়া যায়নি: "+(e2.message||e2)+" — নিচে নিজে উত্তর টিপে দিন, অথবা আরেকটি পরিষ্কার ছবি তুলুন।")}
      entry.innerHTML="";drawEntry(info,pre);
    }catch(e){entry.innerHTML="";say(hintMsg(e.message||String(e)))}
  }

  async function drawEntry(info,pre){
    entry.innerHTML="";entry.appendChild(el("p","⏳ প্রশ্নের তালিকা আনা হচ্ছে…"));
    var ex=await db.from("exams").select("*").eq("id",info.exam_id).maybeSingle();
    var qr=await db.from("questions").select("*").eq("exam_id",info.exam_id).order("id");
    entry.innerHTML="";
    if(ex.error||!ex.data||qr.error){say("পরীক্ষার তথ্য আনা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।");return}
    var rows=qr.data||[],qm={};rows.forEach(function(z){qm[z.id]=z});
    if(info.perm.some(function(p){return !qm[p.q]})){say("এই পরীক্ষার প্রশ্ন ছাপার পরে বদলে গেছে, তাই উত্তরপত্র মেলানো যাচ্ছে না। শিক্ষককে জানান।");return}
    var exam0=ex.data,sel={},ans={};

    if(pre){

      if(pre.roll!=null)hd.appendChild(el("div","🔢 OMR থেকে পড়া রোল: "+(bad?pre.roll.replace(/\?/g,"▢")+" (কিছু ঘর অস্পষ্ট)":pre.roll)));
      var nt=el("div","🤖 ছবি থেকে পড়া হয়েছে। নিচে ছবির সঙ্গে মিলিয়ে নিন: সবুজ বৃত্ত = পড়া উত্তর, লাল = একাধিক/অস্পষ্ট। লাল সারিগুলো নিজে ঠিক করুন।","err");nt.style.margin="8px 0";hd.appendChild(nt);
      pre.cv.style.cssText="width:100%;border-radius:8px;margin:6px 0";hd.appendChild(pre.cv);
    }else hd.appendChild(el("div","নিচে প্রতিটি প্রশ্নের জন্য আপনার দাগানো উত্তরটি টিপে দিন।"));
    if(+exam0.neg_mark>0)hd.appendChild(el("div","⚠️ নেগেটিভ মার্কিং: ভুল উত্তরে প্রতি নম্বরে "+bn(exam0.neg_mark)+" নম্বর কাটা যাবে।","err"));
    var cnt=el("div");cnt.style.cssText="margin:8px 0;font-weight:700";hd.appendChild(cnt);
    function upd(){cnt.textContent="উত্তর দেওয়া: "+bn(Object.keys(sel).length)+" / "+bn(info.perm.length)}
    info.perm.forEach(function(p,i){
      var line=el("div",null,"osr"+(pre&&pre.flags[i]?" fl":""));line.appendChild(el("span",bn(i+1),"n"));
      var bs=[];
      p.o.forEach(function(_,j){
        var b=el("button",LET[j],sel[p.q]===j?"on":"");
        b.onclick=function(){
          if(sel[p.q]===j){delete sel[p.q];delete ans[p.q]}else{sel[p.q]=j;ans[p.q]=p.o[j]}
          line.classList.remove("fl");bs.forEach(function(y,kk){y.className=sel[p.q]===kk?"on":""});upd();
        };
        bs.push(b);line.appendChild(b);
      });
      var bd=String(qm[p.q].body||"").replace(/\[\[img:[^\]]*\]\]/g,"[ছবি]").replace(/\s+/g," ");

  }
